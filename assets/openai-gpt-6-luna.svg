    <path d="M548 440Q566 430 578 438L611 450Q626 458 615 473Q608 483 594 478L616 489Q630 498 619 512Q610 523 594 515L608 526Q619 539 606 549Q595 558 580 547L590 557Q595 572 581 579Q567 586 549 568L515 532Q499 514 505 492Q509 470 525 456Z"
