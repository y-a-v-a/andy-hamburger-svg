    <!-- Pop-art accents -->
    <path d="M96 271L133 254L119 292Z" fill="#52d4d0" stroke="#20204a" stroke-width="5"/>
    <path d="M658 224L692 241L660 258Z" fill="#52d4d0" stroke="#20204a" stroke-width="5"/>
    <path d="M157 405L187 391L180 424Z" fill="#f8db36" stroke="#20204a" stroke-width="5"/>
