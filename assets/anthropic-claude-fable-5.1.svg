<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>Andy Warhol eating a hamburger</title>

  <defs>
    <!-- pop-art halftone dots -->
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="4" fill="#ff4fa3" opacity="0.55"/>
    </pattern>
    <clipPath id="faceClip">
      <ellipse cx="300" cy="270" rx="72" ry="88"/>
    </clipPath>
  </defs>

  <!-- background: four-color Warhol-style panel -->
  <rect x="0" y="0" width="300" height="300" fill="#ffe14d"/>
  <rect x="300" y="0" width="300" height="300" fill="#4fd1ff"/>
  <rect x="0" y="300" width="300" height="300" fill="#ff8a3d"/>
  <rect x="300" y="300" width="300" height="300" fill="#b0ff6a"/>
  <rect x="0" y="0" width="600" height="600" fill="url(#dots)"/>

  <!-- table -->
  <rect x="0" y="500" width="600" height="100" fill="#f4f4f4"/>
  <line x1="0" y1="500" x2="600" y2="500" stroke="#222" stroke-width="4"/>

  <!-- burger wrapper on table -->
  <path d="M380 505 L470 498 L500 520 L470 530 L400 528 Z" fill="#fff" stroke="#222" stroke-width="3"/>
  <path d="M400 512 L450 508 L470 518 L440 522 Z" fill="#e8d7a8" stroke="#222" stroke-width="2"/>

  <!-- ketchup bottle -->
  <g transform="translate(120,0)">
    <rect x="0" y="420" width="14" height="22" fill="#eee" stroke="#222" stroke-width="3"/>
    <path d="M-4 440 Q-10 448 -10 470 L-10 498 Q-10 502 -6 502 L20 502 Q24 502 24 498 L24 470 Q24 448 18 440 Z"
          fill="#c8102e" stroke="#222" stroke-width="3"/>
    <path d="M-2 462 L16 462 L13 486 L1 486 Z" fill="#fff" stroke="#222" stroke-width="2"/>
    <text x="7" y="479" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#222">KETCHUP</text>
  </g>

  <!-- body / black turtleneck -->
  <path d="M150 600 L150 470 Q160 400 230 395 L370 395 Q440 400 450 470 L450 600 Z"
        fill="#111" stroke="#222" stroke-width="4"/>
  <!-- turtleneck collar -->
  <path d="M258 395 Q300 380 342 395 L342 370 Q300 356 258 370 Z" fill="#1c1c1c" stroke="#222" stroke-width="3"/>

  <!-- neck -->
  <rect x="272" y="340" width="56" height="40" fill="#f3e2d3" stroke="#222" stroke-width="3"/>

  <!-- ears -->
  <ellipse cx="228" cy="275" rx="12" ry="20" fill="#f3e2d3" stroke="#222" stroke-width="3"/>
  <ellipse cx="372" cy="275" rx="12" ry="20" fill="#f3e2d3" stroke="#222" stroke-width="3"/>

  <!-- face -->
  <ellipse cx="300" cy="270" rx="72" ry="88" fill="#f3e2d3" stroke="#222" stroke-width="4"/>

  <!-- cheek shading -->
  <g clip-path="url(#faceClip)">
    <ellipse cx="260" cy="300" rx="22" ry="12" fill="#f5c9c2" opacity="0.5"/>
    <ellipse cx="340" cy="300" rx="22" ry="12" fill="#f5c9c2" opacity="0.5"/>
  </g>

  <!-- the silver wig -->
  <path d="M222 250
           L216 215 L232 222 L228 192 L246 205 L250 176 L266 194 L278 166 L292 188
           L306 162 L318 188 L334 166 L344 192 L358 176 L362 206 L380 194 L376 222
           L394 216 L384 252
           Q380 200 340 196 Q300 190 262 198 Q226 206 222 250 Z"
        fill="#e9e9e9" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <!-- wig strands -->
  <g stroke="#9a9a9a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M250 240 Q252 215 262 200"/>
    <path d="M275 232 Q278 205 290 192"/>
    <path d="M300 230 Q302 202 306 186"/>
    <path d="M325 232 Q322 205 320 192"/>
    <path d="M350 240 Q348 215 340 200"/>
  </g>

  <!-- eyebrows -->
  <path d="M248 240 Q270 232 290 240" fill="none" stroke="#777" stroke-width="3" stroke-linecap="round"/>
  <path d="M310 240 Q330 232 352 240" fill="none" stroke="#777" stroke-width="3" stroke-linecap="round"/>

  <!-- glasses -->
  <g fill="rgba(255,255,255,0.35)" stroke="#222" stroke-width="5">
    <circle cx="270" cy="266" r="24"/>
    <circle cx="330" cy="266" r="24"/>
  </g>
  <line x1="294" y1="264" x2="306" y2="264" stroke="#222" stroke-width="5"/>
  <line x1="246" y1="262" x2="232" y2="258" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="354" y1="262" x2="368" y2="258" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <!-- eyes behind lenses -->
  <circle cx="272" cy="268" r="5" fill="#222"/>
  <circle cx="328" cy="268" r="5" fill="#222"/>
  <!-- lens glints -->
  <path d="M256 256 Q262 250 270 250" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M316 256 Q322 250 330 250" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

  <!-- nose -->
  <path d="M300 280 L294 306 L306 306" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/>

  <!-- open mouth, mid-bite -->
  <ellipse cx="308" cy="332" rx="15" ry="11" fill="#7a1f2b" stroke="#222" stroke-width="3"/>
  <rect x="297" y="323" width="22" height="5" fill="#fff"/>

  <!-- the hamburger -->
  <g transform="translate(340,330)">
    <!-- bottom bun -->
    <path d="M-40 24 L40 24 L40 34 Q40 46 28 46 L-28 46 Q-40 46 -40 34 Z" fill="#d79a46" stroke="#222" stroke-width="3"/>
    <!-- patty -->
    <rect x="-44" y="12" width="88" height="14" rx="4" fill="#6b3a1f" stroke="#222" stroke-width="3"/>
    <!-- cheese -->
    <path d="M-42 4 L42 4 L42 12 L36 16 L30 12 L22 17 L14 12 L6 17 L-2 12 L-10 17 L-18 12 L-26 17 L-34 12 L-42 14 Z"
          fill="#ffcc33" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
    <!-- lettuce -->
    <path d="M-44 0 Q-38 -8 -30 0 Q-22 -8 -14 0 Q-6 -8 2 0 Q10 -8 18 0 Q26 -8 34 0 Q40 -6 44 0 L44 6 L-44 6 Z"
          fill="#5fbf3a" stroke="#222" stroke-width="3"/>
    <!-- tomato -->
    <rect x="-38" y="-6" width="76" height="8" rx="3" fill="#e03c31" stroke="#222" stroke-width="2"/>
    <!-- top bun with a bite taken out -->
    <path d="M-42 -4 Q-42 -36 0 -36 Q42 -36 42 -4 Z" fill="#e2a94f" stroke="#222" stroke-width="3"/>
    <path d="M-44 -4 Q-30 -14 -34 -24 Q-24 -30 -20 -36 L-42 -36 Z" fill="#ff8a3d" opacity="0"/>
    <!-- sesame seeds -->
    <g fill="#fff3d6" stroke="#222" stroke-width="1">
      <ellipse cx="-20" cy="-22" rx="4" ry="2.5" transform="rotate(-20 -20 -22)"/>
      <ellipse cx="-4" cy="-30" rx="4" ry="2.5" transform="rotate(10 -4 -30)"/>
      <ellipse cx="12" cy="-26" rx="4" ry="2.5" transform="rotate(-10 12 -26)"/>
      <ellipse cx="26" cy="-16" rx="4" ry="2.5" transform="rotate(25 26 -16)"/>
      <ellipse cx="4" cy="-14" rx="4" ry="2.5" transform="rotate(-30 4 -14)"/>
    </g>
  </g>

  <!-- arm (black sleeve) coming up from the right -->
  <path d="M440 480 Q470 420 410 380 L380 360" fill="none" stroke="#111" stroke-width="40" stroke-linecap="round"/>
  <path d="M440 480 Q470 420 410 380 L380 360" fill="none" stroke="#222" stroke-width="44" stroke-linecap="round" opacity="0.4"/>
  <path d="M440 480 Q470 420 410 380 L380 360" fill="none" stroke="#111" stroke-width="38" stroke-linecap="round"/>

  <!-- hand gripping the burger -->
  <g fill="#f3e2d3" stroke="#222" stroke-width="3">
    <path d="M356 352 Q372 346 386 356 L392 384 Q380 396 362 388 Z"/>
    <rect x="312" y="340" width="34" height="12" rx="6"/>
    <rect x="310" y="353" width="38" height="12" rx="6"/>
    <rect x="314" y="366" width="36" height="12" rx="6"/>
    <rect x="322" y="379" width="30" height="11" rx="5.5"/>
  </g>

  <!-- caption -->
  <rect x="60" y="540" width="480" height="44" fill="#fff" stroke="#222" stroke-width="3"/>
  <text x="300" y="570" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold"
        text-anchor="middle" fill="#222" letter-spacing="2">ANDY WARHOL EATING A HAMBURGER</text>
</svg>