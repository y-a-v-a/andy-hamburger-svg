<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Halftone dot pattern for the pop-art background -->
    <pattern id="halftone" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="5" fill="#FF0000" opacity="0.3"/>
    </pattern>
    
    <!-- Drop shadow for the hamburger -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#FFFF00"/>
  <rect width="800" height="800" fill="url(#halftone)"/>
  <circle cx="400" cy="400" r="320" fill="#00CED1" opacity="0.8"/>

  <!-- Action lines for extra pop-art flair -->
  <g stroke="#FF0000" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="520" y1="250" x2="540" y2="220" />
    <line x1="560" y1="290" x2="590" y2="270" />
    <line x1="580" y1="340" x2="620" y2="330" />
  </g>

  <!-- Body (Iconic Black Turtleneck) -->
  <path d="M 200,800 Q 200,480 400,480 Q 600,480 600,800 Z" fill="#000000"/>
  <path d="M 330,550 Q 400,580 470,550" fill="none" stroke="#333333" stroke-width="6"/>
  <path d="M 315,620 Q 400,660 485,620" fill="none" stroke="#333333" stroke-width="6"/>
  
  <!-- Turtleneck Collar -->
  <path d="M 330,460 Q 400,500 470,460 L 480,540 Q 400,580 320,540 Z" fill="#111111"/>
  <path d="M 330,480 Q 400,510 470,480" fill="none" stroke="#333333" stroke-width="4"/>

  <!-- Neck -->
  <rect x="360" y="380" width="80" height="100" fill="#F5E6D3"/>

  <!-- Ears (drawn behind the head) -->
  <ellipse cx="275" cy="300" rx="25" ry="35" fill="#F5E6D3"/>
  <ellipse cx="525" cy="300" rx="25" ry="35" fill="#F5E6D3"/>

  <!-- Face -->
  <path d="M 280,250 C 280,140 520,140 520,250 C 520,410 460,490 400,490 C 340,490 280,410 280,250 Z" fill="#F5E6D3"/>

  <!-- Wig (Silver/White, styled with a side part) -->
  <path d="M 270,300 C 250,140 350,90 450,110 C 530,125 560,200 530,300 C 500,210 400,190 330,220 C 290,240 270,270 270,300 Z" fill="#D3D3D3"/>
  <path d="M 270,300 C 270,360 280,420 300,440 C 280,390 280,340 290,290 Z" fill="#D3D3D3"/>
  <path d="M 530,300 C 530,360 520,420 500,440 C 520,390 520,340 510,290 Z" fill="#D3D3D3"/>
  <!-- Wig highlights and swoop -->
  <path d="M 280,280 C 300,160 370,120 430,120" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <path d="M 320,210 C 360,180 420,170 460,180" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <path d="M 330,220 Q 380,180 440,190" fill="none" stroke="#E0E0E0" stroke-width="15" stroke-linecap="round"/>

  <!-- Glasses -->
  <g stroke="#000000" stroke-width="8" fill="#FFFFFF" fill-opacity="0.15">
    <rect x="295" y="270" width="90" height="65" rx="20" />
    <rect x="415" y="270" width="90" height="65" rx="20" />
    <path d="M 385,290 Q 400,275 415,290" fill="none" stroke-width="6"/>
    <line x1="295" y1="280" x2="260" y2="270" stroke-width="6"/>
    <line x1="505" y1="280" x2="540" y2="270" stroke-width="6"/>
  </g>
  
  <!-- Glasses Glare -->
  <path d="M 310,325 L 335,275" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M 430,325 L 455,275" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Eyes -->
  <circle cx="340" cy="305" r="7" fill="#000000"/>
  <circle cx="460" cy="305" r="7" fill="#000000"/>
  <circle cx="342" cy="303" r="2" fill="#FFFFFF"/>
  <circle cx="462" cy="303" r="2" fill="#FFFFFF"/>

  <!-- Eyebrows -->
  <path d="M 305,255 Q 340,240 375,255" fill="none" stroke="#A9A9A9" stroke-width="5" stroke-linecap="round"/>
  <path d="M 425,255 Q 460,240 495,255" fill="none" stroke="#A9A9A9" stroke-width="5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 400,310 L 388,365 Q 400,375 412,365" fill="none" stroke="#E8C39E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mouth (Opened wide to take a bite) -->
  <path d="M 355,400 Q 400,435 445,400 Q 400,375 355,400 Z" fill="#8B0000"/>
  <path d="M 365,400 Q 400,385 435,400 Q 400,392 365,400 Z" fill="#FFFFFF"/>
  <path d="M 370,415 Q 400,430 430,415 Q 400,420 370,415 Z" fill="#FF69B4"/>

  <!-- Hand holding the burger (drawn behind it) -->
  <path d="M 800,580 Q 640,580 520,380 Q 490,345 465,370 Q 440,395 470,430 Q 590,650 800,680 Z" fill="#F5E6D3"/>
  <path d="M 480,380 Q 500,340 520,365 Q 540,390 510,425 Z" fill="#F5E6D3"/>
  
  <!-- The Hamburger -->
  <g transform="translate(455, 370) rotate(-30)" filter="url(#shadow)">
    <!-- Top Bun -->
    <path d="M -65,0 C -65,-65 65,-65 65,0 Z" fill="#DAA520"/>
    <path d="M -45,-15 C -30,-45 30,-45 45,-15" fill="none" stroke="#F4A460" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Sesame Seeds -->
    <g fill="#FFF8DC">
      <ellipse cx="-30" cy="-25" rx="5" ry="2.5" transform="rotate(-20 -30 -25)"/>
      <ellipse cx="0" cy="-42" rx="5" ry="2.5" transform="rotate(10 0 -42)"/>
      <ellipse cx="30" cy="-25" rx="5" ry="2.5" transform="rotate(40 30 -25)"/>
      <ellipse cx="-15" cy="-10" rx="5" ry="2.5" transform="rotate(-40 -15 -10)"/>
      <ellipse cx="20" cy="-8" rx="5" ry="2.5" transform="rotate(60 20 -8)"/>
      <ellipse cx="-45" cy="-5" rx="5" ry="2.5" transform="rotate(-10 -45 -5)"/>
    </g>
    
    <!-- Lettuce -->
    <path d="M -70,0 Q -55,18 -40,0 T -10,0 T 20,0 T 50,0 T 70,0 L 70,12 L -70,12 Z" fill="#32CD32"/>
    
    <!-- Tomato -->
    <rect x="-62" y="12" width="124" height="14" rx="7" fill="#FF0000"/>
    
    <!-- Cheese (dripping slightly) -->
    <path d="M -65,26 L 65,26 L 55,45 L 45,26 L 35,45 L 25,26 L 15,45 L 5,26 L -5,45 L -15,26 L -25,45 L -35,26 L -45,45 L -55,26 Z" fill="#FFD700"/>
    
    <!-- Beef Patty -->
    <rect x="-66" y="45" width="132" height="22" rx="11" fill="#8B4513"/>
    <path d="M -50,54 Q -25,48 0,54 T 50,54" fill="none" stroke="#5C2E0B" stroke-width="3"/>
    
    <!-- Bottom Bun -->
    <path d="M -65,67 C -65,92 65,92 65,67 Z" fill="#DAA520"/>
  </g>
</svg>