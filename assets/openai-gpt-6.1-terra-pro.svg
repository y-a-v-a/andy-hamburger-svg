  <path d="M263 356H337V427L300 462L263 427Z"
        fill="#f5c6a9" stroke="#161625" stroke-width="7"/>
  <path d="M263 411L300 462L337 411L359 437L334 600H266L241 437Z"
        fill="#f5f2e8" stroke="#161625" stroke-width="6"/>
  <path d="M228 420L282 485L256 503L278 600H126
