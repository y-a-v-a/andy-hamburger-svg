  <!-- White wig -->
  <path d="M218 225L202 192L214 173L201 157L223 148
           L217 127L243 128L247 105L270 114L282 91
           L301 105L319 90L332 112L355 103L360 126
           L385 124L381 146L404 156L392 174L402 192
           L383 222L375 192L360 183L350 166L332 176
           L319 159L302 175L285 158L270 176L253 164
           L242 185L225 192Z"
