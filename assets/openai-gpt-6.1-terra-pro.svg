  <g fill="#fff3cd" transform="rotate(-12 300 335)">
    <ellipse cx="275" cy="336" rx="4" ry="2"/>
    <ellipse cx="293" cy="329" rx="4" ry="2"/>
    <ellipse cx="313" cy="335" rx="4" ry="2"/>
    <ellipse cx="329" cy="330" rx="4" ry="2"/>
