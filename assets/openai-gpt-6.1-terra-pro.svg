<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <title>Andy Warhol eating a hamburger</title>
  <desc>A colorful pop-art portrait of Andy Warhol holding a hamburger.</desc>

  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3" fill="#f25a92" opacity=".55"/>
    </pattern>
  </defs>

  <!-- Pop-art backdrop -->
  <rect width="600" height="600" fill="#ffd946"/>
  <rect width="600" height="600" fill="url(#dots)"/>
  <circle cx="300" cy="260" r="225" fill="#50c9d4"/>
  <path d="M0 510L600 420V600H0Z" fill="#f25a92"/>

  <!-- Jacket and neck -->
  <path d="M126 600Q139 454 228 420L263 404H337L372 420
           Q461 454 474 600Z"
