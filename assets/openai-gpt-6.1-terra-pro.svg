  <ellipse cx="218" cy="258" rx="23" ry="35"
           fill="#f5c6a9" stroke="#161625" stroke-width="7"/>
  <ellipse cx="382" cy="258" rx="23" ry="35"
           fill="#f5c6a9" stroke="#161625" stroke-width="7"/>
  <path d="M220 190Q225 119 300 119Q375 119 380 190
           L374 285Q369 337 335 367Q319 380 300 380
           Q281 380 265 367Q231 337 226 285Z"
