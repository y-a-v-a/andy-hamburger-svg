<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="800" viewBox="0 0 800 800"
     role="img" aria-labelledby="title desc">
  <title id="title">Andy Warhol Eating a Hamburger</title>
  <desc id="desc">
    A pop-art portrait of Andy Warhol with his signature silver wig,
    wearing a black turtleneck and raising a hamburger to his mouth,
    against a vivid pink, yellow, and turquoise background.
  </desc>

  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#16121e" opacity=".15"/>
    </pattern>

    <pattern id="skinDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#b55269" opacity=".32"/>
    </pattern>

    <clipPath id="faceClip">
      <path d="M285 250 Q274 320 292 376
               L314 427 Q348 477 404 491
               Q454 480 490 431 L510 342
               L491 248 Q385 209 285 250Z"/>
    </clipPath>

    <style>
      .ink {
        stroke: #18141d;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .detail {
        fill: none;
        stroke: #18141d;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Screen-printed color fields -->
  <path fill="#ff4f96" d="M0 0H400V400H0Z"/>
  <path fill="#ffe34a" d="M400 0H800V400H400Z"/>
  <path fill="#39d6d0" d="M0 400H400V800H0Z"/>
  <path fill="#ff813e" d="M400 400H800V800H400Z"/>
  <path fill="url(#dots)" d="M0 0H800V800H0Z"/>

  <!-- Offset print shadow -->
  <path d="M162 757 L186 588 Q198 531 291 511
           L314 453 L289 323 L275 211
           Q339 124 445 161 Q539 181 548 293
           L531 425 L492 501
           Q603 518 634 587 L674 757Z"
        fill="#642ba5" opacity=".55"
        transform="translate(17 12)"/>

  <!-- Shoulders and black turtleneck -->
  <path class="ink" fill="#20212a"
        d="M126 800 L164 604 Q178 547 276 521
           L324 497 H460 L511 523
           Q616 542 638 613 L682 800Z"/>
  <path fill="#383746"
        d="M172 793 L202 611 Q214 579 266 562
           L290 606 L269 800Z"/>
  <path class="ink" fill="#11121a"
        d="M313 447 Q390 466 467 442
           L482 531 Q394 580 306 527Z"/>
  <path class="detail" stroke="#686373"
        d="M326 511 Q390 543 459 511"/>

  <!-- Ears -->
  <path class="ink" fill="#f0b29e"
