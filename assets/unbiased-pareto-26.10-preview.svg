    <path d="M374 422 L380 420"/>
    <path d="M405 429 L411 427"/>
    <path d="M455 416 L462 414"/>
    <path d="M477 393 L483 397"/>
    <path d="M503 412 L509 416"/>
    <path d="M432 420 L437 417"/>
    <path d="M480 429 L487 427"/>
    <path d="M524 424 L530 427"/>
