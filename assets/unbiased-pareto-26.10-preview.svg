           L335 476 Q343 468 351 475
           Q357 482 348 491 L337 505
           L359 491 Q370 486 375 495
           Q379 503 367 511 L345 526
           Q328 559 311 572Z"/>
  <path class="detail" d="M301 522 L314 498"/>
  <path class="detail" d="M314 536 L337 505"/>

  <path class="ink" fill="#ffd1af"
        d="M556 555 Q570 532 564 509
           L553 473 Q550 461 540 464
           Q531 467 536 481 L541 499
           L520 482 Q511 476 505 484
           Q500 492 511 501 L527 514
           L505 505 Q494 501 491 511
           Q489 519 502 525 L521 537
           L527 568Z"/>
  <path class="detail" d="M549 522 L541 499"/>
  <path class="detail" d="M541 537 L527 514"/>

  <!-- Turtleneck sleeves cover the wrists -->
  <path class="ink" fill="#20212a"
        d="M158 800 L210 658 Q248 661 294 703
