<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- background -->
  <rect width="400" height="500" fill="#f5d76e"/>

  <!-- body / black turtleneck -->
  <path d="M120 360 Q200 340 280 360 L290 500 L110 500 Z" fill="#1a1a1a"/>
  <ellipse cx="200" cy="350" rx="90" ry="25" fill="#1a1a1a"/>

  <!-- neck -->
  <rect x="175" y="300" width="50" height="60" fill="#f2c9a0"/>

  <!-- head -->
  <ellipse cx="200" cy="210" rx="85" ry="105" fill="#f2c9a0"/>

  <!-- ears -->
  <ellipse cx="115" cy="210" rx="12" ry="20" fill="#f2c9a0"/>
  <ellipse cx="285" cy="210" rx="12" ry="20" fill="#f2c9a0"/>

  <!-- hair (Warhol's iconic white tufts) -->
  <path d="M115 170 Q100 100 130 90 Q150 60 180 80 Q200 40 220 70 Q260 50 270 90 Q300 95 285 170 Z" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <path d="M125 150 Q115 120 140 112" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M275 150 Q285 120 260 112" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

  <!-- glasses -->
  <g fill="none" stroke="#1a1a1a" stroke-width="4">
    <circle cx="165" cy="200" r="32"/>
    <circle cx="235" cy="200" r="32"/>
    <line x1="197" y1="200" x2="203" y2="200"/>
  </g>
  <g fill="#ffffff" opacity="0.25">
    <circle cx="165" cy="200" r="30"/>
    <circle cx="235" cy="200" r="30"/>
  </g>

  <!-- eyes -->
  <circle cx="165" cy="200" r="8" fill="#2a4a7f"/>
  <circle cx="235" cy="200" r="8" fill="#2a4a7f"/>
  <circle cx="168" cy="197" r="3" fill="#ffffff"/>
  <circle cx="238" cy="197" r="3" fill="#ffffff"/>

  <!-- nose -->
  <path d="M200 215 Q195 240 200 250 Q205 240 200 215" fill="#e8b890"/>

  <!-- mouth open -->
  <ellipse cx="200" cy="275" rx="28" ry="18" fill="#8b3a3a"/>
  <ellipse cx="200" cy="270" rx="20" ry="8" fill="#f2c9a0"/>

  <!-- hand holding burger -->
  <path d="M255 290 Q300 280 325 305 Q335 330 310 340 Q280 345 255 330 Z" fill="#f2c9a0" stroke="#d9a87a" stroke-width="1"/>

  <!-- burger -->
  <g transform="translate(225,268)">
    <ellipse cx="0" cy="-14" rx="42" ry="16" fill="#d9a066"/>
    <rect x="-38" y="-2" width="76" height="7" fill="#5a8f3a"/>
    <rect x="-38" y="5" width="76" height="9" fill="#7a4a1f"/>
    <rect x="-38" y="14" width="76" height="6" fill="#c94a3a"/>
    <rect x="-38" y="20" width="76" height="4" fill="#f7e0a0"/>
    <ellipse cx="0" cy="28" rx="42" ry="13" fill="#d9a066"/>
  </g>

  <!-- sesame seeds -->
  <g fill="#fff3d6">
    <circle cx="210" cy="248" r="2"/>
    <circle cx="228" cy="245" r="2"/>
    <circle cx="246" cy="249" r="2"/>
    <circle cx="215" cy="292" r="2"/>
    <circle cx="240" cy="294" r="2"/>
  </g>
</svg>