    <rect x="306" y="398" width="44" height="15" rx="7.5"/>
    <rect x="304" y="414" width="40" height="15" rx="7.5"/>
    <rect x="454" y="366" width="42" height="15" rx="7.5"/>
    <rect x="450" y="382" width="44" height="15" rx="7.5"/>
    <rect x="450" y="398" width="44" height="15" rx="7.5"/>
    <rect x="456" y="414" width="40" height="15" rx="7.5"/>
  </g>

