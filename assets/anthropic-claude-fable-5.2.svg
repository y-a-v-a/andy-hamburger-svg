  <path d="M160 500 L160 650" stroke="#b38a55" stroke-width="2"/>
  <circle cx="115" cy="580" r="26" fill="#f4e3c3" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M99 578 Q99 564 115 564 Q131 564 131 578 Z" fill="#e8a94f" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="98" y="580" width="34" height="5" rx="2.5" fill="#5a3220"/>
  <rect x="100" y="587" width="30" height="7" rx="3.5" fill="#e8a94f" stroke="#1a1a1a" stroke-width="1.5"/>

