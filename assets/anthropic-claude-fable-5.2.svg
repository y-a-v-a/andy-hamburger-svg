  <text x="670" y="596" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#d62828">KETCHUP</text>

  <!-- Crumbs -->
  <g fill="#e3a552">
    <circle cx="380" cy="640" r="3"/>
    <circle cx="415" cy="655" r="2.5"/>
    <circle cx="440" cy="632" r="2"/>
    <circle cx="350" cy="660" r="2"/>
