  <ellipse cx="670" cy="652" rx="42" ry="7" fill="#000000" opacity="0.2"/>
  <rect x="656" y="468" width="28" height="20" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <path d="M658 488 L682 488 L686 520 Q702 535 702 560 L702 640 Q702 650 692 650 L648 650 Q638 650 638 640 L638 560 Q638 535 654 520 Z"
