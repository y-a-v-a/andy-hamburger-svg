  <ellipse cx="125" cy="652" rx="70" ry="8" fill="#000000" opacity="0.2"/>
  <path d="M70 500 L82 488 L94 500 L106 488 L118 500 L130 488 L142 500 L154 488 L166 500 L180 492 L180 650 L70 650 Z"
