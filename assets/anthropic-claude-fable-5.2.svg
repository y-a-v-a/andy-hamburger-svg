    <path d="M316 398 Q328 388 340 398 T364 398 T388 398 T412 398 T436 398 T460 398 T484 398 L484 404 L316 404 Z" fill="#6cc04a"/>
    <path d="M320 396 Q320 346 400 346 Q480 346 480 396 Z" fill="#e8a94f"/>
