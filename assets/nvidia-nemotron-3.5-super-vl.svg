<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <style>
      .skin     { fill: #f5deb3; }
      .hair     { fill: #ffffff; stroke: #000000; stroke-width: 2; }
      .black    { fill: #000000; }
      .bun      { fill: #deb887; stroke: #8b4513; stroke-width: 2; }
      .patty    { fill: #5c4033; }
      .lettuce  { fill: #90ee90; }
      .cheese   { fill: #ffd700; }
      .mouth    { fill: #8b0000; }
      .label    { fill: #000000; font-family: Arial, sans-serif; font-weight: bold; font-size: 22px; }
    </style>
  </defs>

  <!-- Pop Art Background -->
  <rect width="500" height="500" fill="#fff8dc" />
  <circle cx="420" cy="80"  r="70" fill="#ff69b4" opacity="0.3" />
  <circle cx="80"  cy="420" r="70" fill="#00ffff" opacity="0.2" />

  <!-- Andy Warhol -->
  <g id="andy">
    <!-- Black turtleneck / torso -->
    <rect x="160" y="260" width="130" height="200" rx="25" class="black" />
    <!-- Neck -->
    <ellipse cx="225" cy="245" rx="28" ry="35" class="black" />
    <!-- Head -->
    <ellipse cx="225" cy="150" rx="55" ry="65" class="skin" />
    <!-- Iconic white wig -->
    <path d="M 160 110 Q 225 40 290 110 L 310 170 Q 280 180 225 180 Q 170 180 140 170 Z" class="hair" />
    <!-- Sunglasses -->
    <ellipse cx="200" cy="145" rx="18" ry="12" class="black" />
    <ellipse cx="250" cy="145" rx="18" ry="12" class="black" />
    <rect x="218" y="145" width="14" height="10" class="black" />
    <!-- Open mouth -->
    <ellipse cx="225" cy="170" rx="18" ry="8" class="mouth" />
    <!-- Arm reaching toward mouth -->
    <path d="M 210 270 Q 260 220 300 170" stroke="#f5deb3" stroke-width="18" fill="none" stroke-linecap="round" />
    <!-- Hand holding the burger -->
    <circle cx="305" cy="170" r="13" class="skin" stroke="#000000" stroke-width="1" />
  </g>

  <!-- Hamburger -->
  <g id="burger" transform="translate(320, 150)">
    <!-- Bottom bun -->
    <ellipse cx="0" cy="30" rx="26" ry="11" class="bun" />
    <!-- Patty -->
    <ellipse cx="0" cy="20" rx="24" ry="8" class="patty" />
    <!-- Lettuce -->
    <path d="M -24 12 Q 0 -2 24 12 Q 14 20 0 20 Q -14 20 -24 12 Z" class="lettuce" />
    <!-- Cheese slice -->
    <path d="M -22 8 Q 0 0 22 8 L 22 16 Q 0 16 -22 16 Z" class="cheese" />
    <!-- Top bun -->
    <ellipse cx="0" cy="0" rx="26" ry="11" class="bun" />
    <!-- Sesame seeds -->
    <circle cx="-8"  cy="-6" r="1.5" fill="#8b4513" />
    <circle cx="4"   cy="-8" r="1.5" fill="#8b4513" />
    <circle cx="12"  cy="-5" r="1.5" fill="#8b4513" />
    <circle cx="-14" cy="-4" r="1.5" fill="#8b4513" />
  </g>

  <!-- Caption -->
  <text x="250" y="470" text-anchor="middle" class="label">ANDY WARHOL EATS A HAMBURGER</text>
</svg>