<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Background -->
  <rect width="400" height="500" fill="#FFFFE0"/>
  
  <!-- Pop art decorative circles -->
  <circle cx="50" cy="50" r="30" fill="#FF69B4"/>
  <circle cx="350" cy="80" r="25" fill="#FFD700"/>
  <circle cx="60" cy="450" r="35" fill="#00CED1"/>
  <circle cx="340" cy="430" r="20" fill="#FF6347"/>

  <!-- Pop art color panels -->
  <rect x="20" y="340" width="80" height="80" fill="#00BFFF" opacity="0.25"/>
  <rect x="300" y="340" width="80" height="80" fill="#FF1493" opacity="0.25"/>

  <!-- Neck -->
  <rect x="170" y="295" width="60" height="65" rx="10" fill="#FFDBAC"/>

  <!-- Shirt / Collar -->
  <path d="M120,360 Q200,340 280,360 L300,500 L100,500 Z" fill="#FF4500"/>
  <path d="M170,348 L200,380 L230,348" fill="none" stroke="white" stroke-width="3"/>

  <!-- Head -->
  <ellipse cx="200" cy="215" rx="88" ry="105" fill="#FFDBAC"/>

  <!-- Silver wig (iconic Warhol hair) -->
  <ellipse cx="200" cy="130" rx="98" ry="48" fill="#C0C0C0" stroke="#A9A9A9" stroke-width="1"/>
  <ellipse cx="200" cy="120" rx="85" ry="40" fill="#D8D8D8"/>
  <!-- Side hair -->
  <ellipse cx="112" cy="185" rx="22" ry="55" fill="#B8B8B8"/>
  <ellipse cx="288" cy="185" rx="22" ry="55" fill="#B8B8B8"/>
  <!-- Bottom hair fringe -->
  <path d="M115,160 Q130,200 155,175 Q170,210 200,180 Q230,210 245,175 Q270,200 285,160" fill="#C8C8C8"/>

  <!-- Ears -->
  <ellipse cx="112" cy="225" rx="15" ry="20" fill="#F0C090"/>
  <ellipse cx="288" cy="225" rx="15" ry="20" fill="#F0C090"/>

  <!-- Eyebrows -->
  <path d="M155,185 Q172,175 188,185" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M212,185 Q228,175 245,185" fill="none" stroke="#999" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="172" cy="210" rx="13" ry="9" fill="white"/>
  <ellipse cx="228" cy="210" rx="13" ry="9" fill="white"/>
  <circle cx="174" cy="210" r="4.5" fill="#4169E1"/>
  <circle cx="230" cy="210" r="4.5" fill="#4169E1"/>
  <circle cx="174" cy="210" r="1.5" fill="white"/>
  <circle cx="230" cy="210" r="1.5" fill="white"/>

  <!-- Round glasses (Warhol signature) -->
  <circle cx="172" cy="210" r="24" fill="none" stroke="black" stroke-width="3"/>
  <circle cx="228" cy="210" r="24" fill="none" stroke="black" stroke-width="3"/>
  <line x1="196" y1="210" x2="204" y2="210" stroke="black" stroke-width="3"/>
  <line x1="148" y1="203" x2="125" y2="195" stroke="black" stroke-width="3"/>
  <line x1="252" y1="203" x2="275" y2="195" stroke="black" stroke-width="3"/>

  <!-- Nose -->
  <path d="M200,222 Q193,248 198,254 Q202,254 205,248 Q200,222 200,222" fill="none" stroke="#D2A67A" stroke-width="2"/>
  <path d="M196,250 Q200,252 204,250" fill="none" stroke="#D2A67A" stroke-width="1.5"/>

  <!-- Cheeks (slight blush) -->
  <circle cx="148" cy="245" r="14" fill="#FFA07A" opacity="0.3"/>
  <circle cx="252" cy="245" r="14" fill="#FFA07A" opacity="0.3"/>

  <!-- Mouth - open biting burger -->
  <ellipse cx="200" cy="278" rx="22" ry="12" fill="#CD5C5C"/>
  <path d="M182,275 Q200,292 218,275 Q200,282 182,275" fill="#8B0000"/>

  <!-- ===== HAMBURGER ===== -->
  <!-- Left hand (behind burger) -->
  <ellipse cx="125" cy="330" rx="22" ry="28" fill="#FFDBAC" transform="rotate(-15,125,330)"/>
  <!-- Right hand -->
  <ellipse cx="275" cy="330" rx="22" ry="28" fill="#FFDBAC" transform="rotate(15,275,330)"/>

  <!-- Burger assembly positioned in front of mouth -->
  <!-- Top bun -->
  <path d="M135,298 Q140,255 200,248 Q260,255 265,298 Q200,288 135,298Z" fill="#D2691E" stroke="#8B4513" stroke-width="2"/>
  <!-- Top bun highlight -->
  <path d="M150,278 Q200,260 250,278" fill="none" stroke="#E8A050" stroke-width="3"/>
  <!-- Sesame seeds -->
  <ellipse cx="175" cy="265" rx="3" ry="1.5" fill="#FFF8DC" transform="rotate(30,175,265)"/>
  <ellipse cx="200" cy="260" rx="3" ry="1.5" fill="#FFF8DC" transform="rotate(-10,200,260)"/>
  <ellipse cx="225" cy="266" rx="3" ry="1.5" fill="#FFF8DC" transform="rotate(20,225,266)"/>
  <ellipse cx="190" cy="275" rx="3" ry="1.5" fill="#FFF8DC" transform="rotate(45,190,275)"/>
  <ellipse cx="210" cy="275" rx="3" ry="1.5" fill="#FFF8DC" transform="rotate(-30,210,275)"/>

  <!-- Lettuce -->
  <path d="M132,305 Q145,293 158,306 Q168,295 180,308 Q192,296 205,309 Q218,295 232,307 Q245,294 268,305" fill="#32CD32" stroke="#228B22" stroke-width="1.5"/>

  <!-- Cheese -->
  <path d="M138,314 Q200,332 262,314 L255,330 Q200,345 145,330 Z" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>

  <!-- Patty -->
  <ellipse cx="200" cy="335" rx="63" ry="13" fill="#8B4513" stroke="#6B3410" stroke-width="2"/>
  <ellipse cx="200" cy="333" rx="55" ry="8" fill="#A0522D" opacity="0.5"/>

  <!-- Bottom bun -->
  <path d="M138,348 Q140,355 150,358 L250,358 Q260,355 262,348 Q200,342 138,348Z" fill="#D2691E" stroke="#8B4513" stroke-width="2"/>
  <path d="M150,358 Q200,365 250,358" fill="#C8551E" stroke="#8B4513" stroke-width="1"/>

  <!-- Ketchup -->
  <path d="M170,350 Q185,346 195,351" fill="none" stroke="#FF0000" stroke-width="3" stroke-linecap="round"/>
  <path d="M210,350 Q225,346 235,351" fill="none" stroke="#FF0000" stroke-width="3" stroke-linecap="round"/>

  <!-- Thumb visible on top of burger -->
  <ellipse cx="148" cy="305" rx="10" ry="6" fill="#FFDBAC" transform="rotate(-25,148,305)"/>
  <ellipse cx="252" cy="305" rx="10" ry="6" fill="#FFDBAC" transform="rotate(25,252,305)"/>

  <!-- Fingers detail -->
  <path d="M115,310 Q108,320 110,335" fill="none" stroke="#F0C090" stroke-width="2"/>
  <path d="M285,310 Q292,320 290,335" fill="none" stroke="#F0C090" stroke-width="2"/>

  <!-- Pop art color shift box (Warhol-style duplicate face hint) -->
  <rect x="28" y="28" width="72" height="72" fill="#FF69B4" opacity="0.15"/>
  <ellipse cx="64" cy="64" rx="25" ry="30" fill="#FFDBAC" opacity="0.2"/>
  <circle cx="64" cy="55" r="12" fill="none" stroke="black" stroke-width="1" opacity="0.3"/>

  <!-- Text -->
  <text x="200" y="482" font-family="Arial, sans-serif" font-size="16" fill="#333" font-style="italic" text-anchor="middle">— Andy's Lunch —</text>
  <text x="200" y="497" font-family="Arial, sans-serif" font-size="11" fill="#999" font-style="italic" text-anchor="middle">pop art edition</text>
</svg>