<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Andy Warhol Eating a Hamburger</title>
  <desc id="desc">Pop-art style vector illustration of Andy Warhol with white wig and glasses eating a hamburger.</desc>

  <defs>
    <pattern id="halftone" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="5" fill="#ffffff" opacity="0.25"/>
    </pattern>

    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d5b3"/>
      <stop offset="100%" stop-color="#e8b98a"/>
    </linearGradient>

    <linearGradient id="bunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8c65f"/>
      <stop offset="100%" stop-color="#d98c2b"/>
    </linearGradient>

    <linearGradient id="pattyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4a2b"/>
      <stop offset="100%" stop-color="#4a2a18"/>
    </linearGradient>
  </defs>

  <!-- Pop-art background -->
  <rect width="800" height="800" fill="#f5f5f5"/>
  <rect x="0" y="0" width="400" height="400" fill="#ff5d8f"/>
  <rect x="400" y="0" width="400" height="400" fill="#ffd166"/>
  <rect x="0" y="400" width="400" height="400" fill="#06d6a0"/>
  <rect x="400" y="400" width="400" height="400" fill="#118ab2"/>
  <rect width="800" height="800" fill="url(#halftone)"/>
  <rect x="20" y="20" width="760" height="760" fill="none" stroke="#111" stroke-width="8"/>

  <!-- Torso -->
  <path d="M220 800 Q230 620 300 560 Q350 520 400 520 Q450 520 500 560 Q570 620 580 800 Z" fill="#111" stroke="#111" stroke-width="6"/>

  <!-- Neck -->
  <rect x="355" y="490" width="90" height="80" rx="12" fill="url(#skin)" stroke="#111" stroke-width="5"/>

  <!-- Sleeves -->
  <path d="M220 700 Q220 600 260 560 Q285 585 270 630 Q260 690 250 730 Z" fill="#111" stroke="#111" stroke-width="5"/>
  <path d="M580 700 Q580 600 540 560 Q515 585 530 630 Q540 690 550 730 Z" fill="#111" stroke="#111" stroke-width="5"/>

  <!-- Head -->
  <ellipse cx="400" cy="350" rx="125" ry="155" fill="url(#skin)" stroke="#111" stroke-width="6"/>

  <!-- Ears -->
  <ellipse cx="278" cy="365" rx="22" ry="35" fill="url(#skin)" stroke="#111" stroke-width="5"/>
  <ellipse cx="522" cy="365" rx="22" ry="35" fill="url(#skin)" stroke="#111" stroke-width="5"/>

  <!-- Wig -->
  <path d="M270 330 C255 220 315 145 400 140 C485 145 545 220 530 330 C520 290 500 240 460 225 C430 215 415 235 400 250 C385 235 370 215 340 225 C300 240 280 290 270 330 Z" fill="#f2f2f2" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
  <path d="M270 330 Q260 380 275 430 Q285 400 290 360 Q285 340 270 330 Z" fill="#f2f2f2" stroke="#111" stroke-width="5"/>
  <path d="M530 330 Q540 380 525 430 Q515 400 510 360 Q515 340 530 330 Z" fill="#f2f2f2" stroke="#111" stroke-width="5"/>
  <path d="M320 210 Q360 170 400 170 Q440 170 480 210" fill="none" stroke="#d9d9d9" stroke-width="4" stroke-linecap="round"/>
  <path d="M300 250 Q350 200 400 200 Q450 200 500 250" fill="none" stroke="#d9d9d9" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M315 305 Q350 290 385 305" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>
  <path d="M415 305 Q450 290 485 305" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>

  <!-- Glasses -->
  <ellipse cx="348" cy="350" rx="50" ry="38" fill="#bde0fe" fill-opacity="0.5" stroke="#111" stroke-width="10"/>
  <ellipse cx="452" cy="350" rx="50" ry="38" fill="#bde0fe" fill-opacity="0.5" stroke="#111" stroke-width="10"/>
  <path d="M398 350 Q400 340 402 350" stroke="#111" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M298 350 L278 365" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <path d="M502 350 L522 365" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <circle cx="348" cy="350" r="6" fill="#111"/>
  <circle cx="452" cy="350" r="6" fill="#111"/>

  <!-- Nose -->
  <path d="M400 365 Q390 410 375 430 Q400 445 425 430 Q410 410 400 365" fill="none" stroke="#c68642" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mouth -->
  <path d="M345 445 Q400 500 455 445 Q435 475 400 480 Q365 475 345 445 Z" fill="#6b1f1f" stroke="#111" stroke-width="5"/>
  <path d="M355 448 Q400 470 445 448" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="400" cy="465" rx="25" ry="10" fill="#d94f70" opacity="0.8"/>

  <!-- Hands -->
  <path d="M250 560 Q285 520 320 535 Q340 550 330 585 Q310 615 275 605 Q245 590 250 560 Z" fill="url(#skin)" stroke="#111" stroke-width="5"/>
  <path d="M280 545 Q300 555 315 550" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <path d="M270 565 Q295 575 315 570" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <path d="M265 585 Q290 595 310 590" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>

  <path d="M550 560 Q515 520 480 535 Q460 550 470 585 Q490 615 525 605 Q555 590 550 560 Z" fill="url(#skin)" stroke="#111" stroke-width="5"/>
  <path d="M520 545 Q500 555 485 550" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <path d="M530 565 Q505 575 485 570" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <path d="M535 585 Q510 595 490 590" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>

  <!-- Hamburger -->
  <g id="hamburger">
    <!-- Top bun -->
    <path d="M310 520 Q315 475 400 475 Q485 475 490 520 Q450 540 400 540 Q350 540 310 520 Z" fill="url(#bunGrad)" stroke="#111" stroke-width="6"/>

    <!-- Sesame seeds -->
    <ellipse cx="350" cy="500" rx="8" ry="4" fill="#fff8e7" transform="rotate(-15 350 500)"/>
    <ellipse cx="400" cy="490" rx="8" ry="4" fill="#fff8e7"/>
    <ellipse cx="450" cy="500" rx="8" ry="4" fill="#fff8e7" transform="rotate(15 450 500)"/>
    <ellipse cx="375" cy="515" rx="6" ry="3" fill="#fff8e7" transform="rotate(-10 375 515)"/>
    <ellipse cx="425" cy="515" rx="6" ry="3" fill="#fff8e7" transform="rotate(10 425 515)"/>

    <!-- Lettuce -->
    <path d="M305 540 Q330 525 355 540 Q380 525 405 540 Q430 525 455 540 Q480 525 500 540 Q490 560 400 560 Q310 560 305 540 Z" fill="#5cb85c" stroke="#111" stroke-width="5"/>

    <!-- Cheese -->
    <path d="M315 555 L490 555 L480 575 L320 575 Z" fill="#ffd166" stroke="#111" stroke-width="5"/>

    <!-- Patty -->
    <path d="M320 570 Q400 590 485 570 L480 595 Q400 615 320 595 Z" fill="url(#pattyGrad)" stroke="#111" stroke-width="5"/>

    <!-- Bottom bun -->
    <path d="M315 590 Q400 630 490 590 Q500 615 400 635 Q300 615 315 590 Z" fill="url(#bunGrad)" stroke="#111" stroke-width="6"/>
  </g>

  <!-- Label -->
  <text x="400" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke">Andy Warhol eating a hamburger</text>
</svg>