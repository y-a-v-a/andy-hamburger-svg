<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Pop Art halftone dot pattern -->
    <pattern id="halftone" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#000000" opacity="0.12" />
      <circle cx="12" cy="12" r="2.2" fill="#000000" opacity="0.12" />
    </pattern>

    <!-- Clip path for the background circle -->
    <clipPath id="circleClip">
      <circle cx="300" cy="295" r="235" />
    </clipPath>
  </defs>

  <!-- Pop Art Background -->
  <rect width="600" height="600" fill="#FF3E7F" />
  <rect width="600" height="600" fill="url(#halftone)" />

  <!-- Yellow Pop Circle with Cyan Screenprint Offset -->
  <circle cx="312" cy="305" r="235" fill="#00E5FF" />
  <circle cx="300" cy="295" r="235" fill="#FFE600" stroke="#111111" stroke-width="5" />
  <circle cx="300" cy="295" r="235" fill="url(#halftone)" />

  <!-- Everything inside the portrait -->
  <g stroke="#111111" stroke-linejoin="round" stroke-linecap="round">

    <!-- Back Hair Silhouette (for depth behind neck/ears) -->
    <path d="M 192 250 C 175 190, 195 100, 300 92 C 405 100, 425 190, 408 250 L 395 295 L 205 295 Z"
          fill="#CBD5E1" stroke-width="4.5" />

    <!-- Torso / Black Blazer & Turtleneck -->
    <path d="M 105 605 L 138 458 C 155 425, 200 408, 245 405 L 355 405 C 400 408, 445 425, 462 458 L 495 605 Z"
          fill="#1E293B" stroke-width="5" />
    <!-- Blazer Lapels -->
    <path d="M 235 406 L 195 470 L 235 500 L 252 605" fill="#0F172A" stroke-width="4" />
    <path d="M 365 406 L 405 470 L 365 500 L 348 605" fill="#0F172A" stroke-width="4" />
    <!-- Turtleneck -->
    <path d="M 244 365 L 240 450 Q 300 470 360 450 L 356 365 Z"
          fill="#111111" stroke-width="4.5" />
    <path d="M 243 388 Q 300 402 357 388" fill="none" stroke="#334155" stroke-width="3" />

    <!-- Ears -->
    <path d="M 215 245 C 194 242, 192 288, 214 295" fill="#F6C8B6" stroke-width="4" />
    <path d="M 208 260 Q 202 272 211 280" fill="none" stroke="#111111" stroke-width="2.5" />
    <path d="M 385 245 C 406 242, 408 288, 386 295" fill="#F6C8B6" stroke-width="4" />
    <path d="M 392 260 Q 398 272 389 280" fill="none" stroke="#111111" stroke-width="2.5" />

    <!-- Face Base -->
    <path d="M 214 195 C 210 275, 222 335, 258 372 Q 300 398 342 372 C 378 335, 390 275, 386 195 Z"
          fill="#FDE4D8" stroke-width="4.5" />

    <!-- Warhol High-Cheekbone Pop Art Shading -->
    <path d="M 218 265 C 228 310, 245 348, 272 372 L 258 372 C 226 340, 215 298, 215 265 Z"
          fill="#F4B29D" stroke="none" />
    <path d="M 225 275 Q 245 292 256 312 Q 238 308 228 292 Z"
          fill="#F4B29D" stroke="none" />
    <path d="M 375 275 Q 355 292 344 312 Q 362 308 372 292 Z"
          fill="#F4B29D" stroke="none" />

    <!-- Eyes (Deadpan Warhol Gaze) -->
    <!-- Left Eye -->
    <ellipse cx="262" cy="245" rx="18" ry="11" fill="#FFFFFF" stroke-width="3" />
    <circle cx="263" cy="246" r="6.5" fill="#3B82F6" stroke-width="2" />
    <circle cx="263" cy="246" r="3" fill="#111111" stroke="none" />
    <circle cx="265" cy="244" r="1.5" fill="#FFFFFF" stroke="none" />
    <!-- Droopy Eyelid -->
    <path d="M 244 244 Q 262 232 280 244 Q 262 240 244 244 Z" fill="#F4B29D" stroke-width="2.5" />

    <!-- Right Eye -->
    <ellipse cx="338" cy="245" rx="18" ry="11" fill="#FFFFFF" stroke-width="3" />
    <circle cx="337" cy="246" r="6.5" fill="#3B82F6" stroke-width="2" />
    <circle cx="337" cy="246" r="3" fill="#111111" stroke="none" />
    <circle cx="339" cy="244" r="1.5" fill="#FFFFFF" stroke="none" />
    <!-- Droopy Eyelid -->
    <path d="M 320 244 Q 338 232 356 244 Q 338 240 320 244 Z" fill="#F4B29D" stroke-width="2.5" />

    <!-- Eyebrows -->
    <path d="M 240 222 Q 262 214 284 221" fill="none" stroke-width="4" />
    <path d="M 316 221 Q 338 214 360 222" fill="none" stroke-width="4" />

    <!-- Angular Nose -->
    <path d="M 300 232 L 296 286 Q 290 298 302 302 Q 312 301 312 293"
          fill="#F6C8B6" stroke-width="3.5" />
    <path d="M 294 295 Q 298 299 303 297" fill="none" stroke-width="2.5" />

    <!-- Iconic Glasses -->
    <g>
      <!-- Left Frame -->
      <rect x="230" y="226" width="60" height="40" rx="8" fill="#00E5FF" fill-opacity="0.18" stroke="#111111" stroke-width="5" />
      <!-- Right Frame -->
      <rect x="310" y="226" width="60" height="40" rx="8" fill="#00E5FF" fill-opacity="0.18" stroke="#111111" stroke-width="5" />
      <!-- Bridge & Temples -->
      <path d="M 290 240 Q 300 236 310 240" fill="none" stroke-width="5" />
      <path d="M 214 238 L 230 238" fill="none" stroke-width="4.5" />
      <path d="M 370 238 L 386 238" fill="none" stroke-width="4.5" />
      <!-- Lens Glare -->
      <path d="M 239 233 L 252 233 L 241 256 L 236 256 Z" fill="#FFFFFF" fill-opacity="0.55" stroke="none" />
      <path d="M 319 233 L 332 233 L 321 256 L 316 256 Z" fill="#FFFFFF" fill-opacity="0.55" stroke="none" />
    </g>

    <!-- Iconic Messy Silver-White Wig -->
    <path d="M 205 245
             C 182 225, 175 180, 198 152
             L 185 142 C 202 125, 222 108, 248 102
             L 242 88 C 272 82, 315 80, 345 92
             L 358 84 C 388 96, 412 122, 418 154
             L 430 158 C 425 188, 418 220, 396 246
             L 388 225
             C 386 202, 376 184, 362 178
             L 354 202 L 338 178 L 318 208 L 306 184
             L 280 212 L 266 190 L 238 216 L 232 192
             L 215 224 Z"
          fill="#F8FAFC" stroke-width="4.5" />

    <!-- Wig Shading & Shaggy Strands -->
    <path d="M 215 155 Q 250 128 295 130" fill="none" stroke="#94A3B8" stroke-width="3" />
    <path d="M 248 118 Q 300 105 362 125" fill="none" stroke="#94A3B8" stroke-width="3" />
    <path d="M 332 142 Q 368 150 392 178" fill="none" stroke="#94A3B8" stroke-width="3" />
    <path d="M 202 178 Q 224 162 248 168" fill="none" stroke="#CBD5E1" stroke-width="3.5" />
    <path d="M 272 152 L 260 185" fill="none" stroke="#94A3B8" stroke-width="2.5" />
    <path d="M 326 146 L 334 176" fill="none" stroke="#94A3B8" stroke-width="2.5" />

    <!-- Open Mouth Taking a Bite -->
    <path d="M 272 318 Q 300 310 328 318 Q 324 345 300 348 Q 276 345 272 318 Z"
          fill="#991B1B" stroke-width="3.5" />
    <!-- Upper Teeth -->
    <path d="M 278 318 Q 300 314 322 318 L 319 327 L 281 327 Z"
          fill="#FFFFFF" stroke-width="2.5" />
    <!-- Upper Lip -->
    <path d="M 268 318 Q 288 308 300 314 Q 312 308 332 318 Q 315 322 300 320 Q 285 322 268 318 Z"
          fill="#E5989B" stroke-width="2.5" />

    <!-- ================= HAMBURGER ================= -->
    <g id="hamburger">
      <!-- Bottom Bun -->
      <path d="M 225 408 Q 300 416 375 408 L 372 430 Q 300 448 228 430 Z"
            fill="#E9A15B" stroke-width="4" />

      <!-- Burger Patty -->
      <path d="M 218 386 Q 240 380 265 386 Q 300 380 335 386 Q 360 380 382 386
               C 388 398, 385 412, 374 414
               Q 335 420 300 414 Q 265 420 226 414
               C 215 412, 212 398, 218 386 Z"
            fill="#5C3A21" stroke-width="4" />
      <!-- Patty Texture -->
      <circle cx="248" cy="400" r="2.2" fill="#3E2514" stroke="none" />
      <circle cx="348" cy="402" r="2.2" fill="#3E2514" stroke="none" />
      <circle cx="275" cy="405" r="2" fill="#3E2514" stroke="none" />

      <!-- Melting Cheese -->
      <path d="M 225 384 L 375 384 L 365 398 L 330 392 L 302 414 L 274 392 L 238 400 Z"
            fill="#FACC15" stroke-width="3.5" />

      <!-- Tomato Slices -->
      <path d="M 226 376 Q 262 372 298 378 L 296 388 Q 260 386 226 385 Z"
            fill="#EF4444" stroke-width="3.5" />
      <path d="M 302 378 Q 338 372 374 376 L 374 385 Q 340 386 304 388 Z"
            fill="#EF4444" stroke-width="3.5" />

      <!-- Lettuce -->
      <path d="M 214 372
               Q 226 358 242 370 Q 258 358 274 370
               Q 290 360 306 370 Q 322 358 340 370
               Q 358 358 376 370 Q 388 364 386 378
               Q 368 384 352 378 Q 334 386 316 378
               Q 298 386 280 378 Q 262 386 244 378
               Q 226 384 214 372 Z"
            fill="#22C55E" stroke-width="3.5" />

      <!-- Top Bun (with Bite Taken Out!) -->
      <path d="M 224 366
               C 224 342, 248 326, 275 322
               Q 282 336 294 338 Q 302 346 312 338 Q 324 336 328 322
               C 354 326, 376 342, 376 366
               Q 300 374 224 366 Z"
            fill="#F4A261" stroke-width="4" />

      <!-- Exposed Crumb Inside Bite Mark -->
      <path d="M 275 322 Q 282 336 294 338 Q 302 346 312 338 Q 324 336 328 322 Q 302 332 275 322 Z"
            fill="#FDE68A" stroke-width="3" />

      <!-- Sesame Seeds -->
      <ellipse cx="250" cy="346" rx="4.5" ry="2.2" transform="rotate(-20 250 346)" fill="#FFFBEB" stroke-width="1.5" />
      <ellipse cx="268" cy="336" rx="4.5" ry="2.2" transform="rotate(15 268 336)" fill="#FFFBEB" stroke-width="1.5" />
      <ellipse cx="344" cy="344" rx="4.5" ry="2.2" transform="rotate(22 344 344)" fill="#FFFBEB" stroke-width="1.5" />
      <ellipse cx="356" cy="356" rx="4.5" ry="2.2" transform="rotate(-12 356 356)" fill="#FFFBEB" stroke-width="1.5" />
      <ellipse cx="242" cy="358" rx="4.5" ry="2.2" transform="rotate(10 242 358)" fill="#FFFBEB" stroke-width="1.5" />

      <!-- Classic Fast-Food Wrapper Around Bottom -->
      <path d="M 220 406 L 234 402 L 248 412 L 298 408 L 352 412 L 366 402 L 380 406
               L 368 468 Q 300 480 232 468 Z"
            fill="#F8FAFC" stroke-width="4" />
      <!-- Red Stripes on Wrapper -->
      <path d="M 238 424 Q 300 434 362 424 L 360 436 Q 300 446 240 436 Z" fill="#EF4444" stroke="none" />
      <path d="M 243 446 Q 300 456 357 446 L 355 456 Q 300 466 245 456 Z" fill="#EF4444" stroke="none" />
      <!-- Re-stroke Wrapper Outline cleanly -->
      <path d="M 220 406 L 234 402 L 248 412 L 298 408 L 352 412 L 366 402 L 380 406
               L 368 468 Q 300 480 232 468 Z"
            fill="none" stroke="#111111" stroke-width="4" />
    </g>

    <!-- ================= HANDS HOLDING BURGER ================= -->
    <!-- Left Hand -->
    <g>
      <!-- Forearm/Palm -->
      <path d="M 168 505 L 195 415 C 200 398, 212 388, 224 390 L 236 452 L 210 520 Z"
            fill="#FDE4D8" stroke-width="4" />
      <!-- Fingers curling onto bun/wrapper -->
      <rect x="206" y="362" width="32" height="16" rx="8" fill="#FDE4D8" stroke-width="3.5" />
      <rect x="202" y="378" width="36" height="16" rx="8" fill="#FDE4D8" stroke-width="3.5" />
      <rect x="206" y="394" width="34" height="16" rx="8" fill="#FDE4D8" stroke-width="3.5" />
      <rect x="212" y="410" width="30" height="15" rx="7.5" fill="#FDE4D8" stroke-width="3.5" />
      <!-- Thumb -->
      <path d="M 228 430 Q 252 428 256 444 Q 254 456 232 452" fill="#F6C8B6" stroke-width="3.5" />
    </g>

    <!-- Right Hand -->
    <g>
      <!-- Forearm/Palm -->
      <path d="M 432 505 L 405 415 C 400 398, 388 388, 376 390 L 364 452 L 390 520 Z"
            fill="#FDE4D8" stroke-width="4" />
      <!-- Fingers curling onto bun/wrapper -->
      <rect x="362" y="362" width="32" height="16" rx="8" fill="#FDE4D8" stroke-width="3.5" />
      <rect x="362" y="378" width="36" height="16" rx="8" fill="#FDE4D8" stroke-width="3.5" />
      <rect x="360" y="394" width="34" height="16" rx="8" fill="#FDE4D8" stroke-width="3.5" />
      <rect x="358" y="410" width="30" height="15" rx="7.5" fill="#FDE4D8" stroke-width="3.5" />
      <!-- Thumb -->
      <path d="M 372 430 Q 348 428 344 444 Q 346 456 368 452" fill="#F6C8B6" stroke-width="3.5" />
    </g>

    <!-- Pop Art Crumbs -->
    <circle cx="288" cy="356" r="2.8" fill="#FDE68A" stroke-width="2" />
    <circle cx="314" cy="352" r="2.2" fill="#FDE68A" stroke-width="2" />

  </g>
</svg>