<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#FFD700"/>
  
  <!-- Head -->
  <circle cx="100" cy="80" r="35" fill="#FFE0BD"/>
  
  <!-- Hair (Silver Wig) -->
  <path d="M65 80 Q65 30 100 30 Q135 30 135 80 L135 90 L65 90 Z" fill="#C0C0C0"/>
  <path d="M65 80 Q65 40 100 40 Q135 40 135 80" fill="none" stroke="#808080" stroke-width="2"/>
  
  <!-- Glasses -->
  <g stroke="black" stroke-width="2" fill="none">
    <circle cx="85" cy="75" r="8"/>
    <circle cx="115" cy="75" r="8"/>
    <line x1="85" y1="75" x2="115" y2="75"/>
  </g>
  
  <!-- Mouth -->
  <path d="M90 95 Q100 100 110 95" stroke="black" fill="none"/>
  
  <!-- Hamburger -->
  <g transform="translate(60, 110)">
    <!-- Top Bun -->
    <path d="M0 10 Q15 0 30 10 L30 20 L0 20 Z" fill="#D2691E"/>
    <!-- Patty -->
    <rect x="0" y="20" width="30" height="8" fill="#5C4033"/>
    <!-- Lettuce -->
    <path d="M0 28 Q5 25 10 28 Q15 25 20 28 Q25 25 30 28" stroke="green" fill="none" stroke-width="2"/>
    <!-- Bottom Bun -->
    <rect x="0" y="30" width="30" height="8" fill="#D2691E"/>
  </g>
  
  <!-- Hand holding burger -->
  <path d="M50 130 Q40 150 55 155 Q70 160 60 140" fill="#FFE0BD" stroke="black" stroke-width="2"/>
</svg>