<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Halftone dot pattern -->
    <pattern id="halftone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1" fill="#333" opacity="0.3"/>
    </pattern>
    <!-- Dot pattern for background -->
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.5" fill="#ff69b4" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="#1a1a2e"/>
  <rect width="500" height="500" fill="url(#halftone)"/>
  
  <!-- Pop art color blocks -->
  <rect x="0" y="0" width="500" height="50" fill="#ff69b4" opacity="0.15"/>
  <rect x="0" y="450" width="500" height="50" fill="#00ffff" opacity="0.15"/>
  <rect x="0" y="0" width="50" height="500" fill="#ffff00" opacity="0.1"/>
  <rect x="450" y="0" width="50" height="500" fill="#00ff00" opacity="0.1"/>

  <!-- Title -->
  <text x="250" y="35" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="18" fill="#ff69b4" font-weight="bold">ANDY EATS 🍔</text>

  <!-- Andy Warhol's face -->
  <ellipse cx="190" cy="250" rx="70" ry="85" fill="#f5deb3"/>
  
  <!-- Skin highlights -->
  <ellipse cx="180" cy="230" rx="65" ry="75" fill="#fff8e7"/>

  <!-- Andy's hair (shaggy, wispy) -->
  <g fill="#c0c0c0" stroke="#999" stroke-width="1">
    <ellipse cx="190" cy="165" rx="72" ry="40"/>
    <path d="M120,165 Q115,120 150,100 Q170,85 195,90 Q215,80 235,100 Q255,110 250,165 Q240,150 220,145 Q200,140 190,155 Q180,140 160,145 Q140,150 120,165Z"/>
    <!-- Wispy strands -->
    <path d="M120,165 Q115,155 110,170" stroke="#a8a8a8" stroke-width="2" fill="none"/>
    <path d="M240,165 Q250,155 255,170" stroke="#a8a8a8" stroke-width="2" fill="none"/>
    <path d="M155,90 Q148,70 155,55" stroke="#b0b0b0" stroke-width="2" fill="none"/>
    <path d="M200,85 Q210,65 220,75" stroke="#b0b0b0" stroke-width="2" fill="none"/>
  </g>

  <!-- Eyebrows -->
  <rect x="135" y="175" width="40" height="8" rx="3" fill="#444" transform="rotate(-5,155,179)"/>
  <rect x="195" y="172" width="40" height="8" rx="3" fill="#444" transform="rotate(5,215,176)"/>

  <!-- Eyes -->
  <ellipse cx="155" cy="210" rx="14" ry="12" fill="white"/>
  <ellipse cx="225" cy="210" rx="14" ry="12" fill="white"/>
  <circle cx="157" cy="212" r="7" fill="#2c2c2c"/>
  <circle cx="227" cy="212" r="7" fill="#2c2c2c"/>
  <circle cx="160" cy="209" r="2.5" fill="white"/>
  <circle cx="230" cy="209" r="2.5" fill="white"/>

  <!-- Glasses (Warhol-style thick frames) -->
  <circle cx="155" cy="210" r="20" fill="none" stroke="#1a1a2e" stroke-width="3.5"/>
  <circle cx="225" cy="210" r="20" fill="none" stroke="#1a1a2e" stroke-width="3.5"/>
  <line x1="174" y1="210" x2="196" y2="210" stroke="#1a1a2e" stroke-width="3.5"/>
  <!-- Lens tints -->
  <circle cx="155" cy="210" r="17" fill="#add8e6" opacity="0.15"/>
  <circle cx="225" cy="210" r="17" fill="#add8e6" opacity="0.15"/>

  <!-- Nose -->
  <path d="M185,220 Q180,240 185,248 Q190,240 195,220" fill="none" stroke="#d4a574" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mouth (eating / open) -->
  <ellipse cx="185" cy="270" rx="22" ry="14" fill="#8b4513"/>
  <ellipse cx="185" cy="268" rx="18" ry="8" fill="#c0392b"/>
  <!-- Teeth showing -->
  <rect x="170" y="262" width="8" height="8" rx="1" fill="white"/>
  <rect x="183" y="262" width="8" height="8" rx="1" fill="white"/>
  <rect x="196" y="262" width="8" height="8" rx="1" fill="white"/>
  <!-- Tongue -->
  <ellipse cx="185" cy="275" rx="12" ry="6" fill="#e74c3c"/>

  <!-- Hamburger -->
  <g transform="translate(320, 180)">
    <!-- Hamburger shadow -->
    <ellipse cx="40" cy="340" rx="55" ry="15" fill="#000" opacity="0.3"/>
    
    <!-- Top bun -->
    <ellipse cx="40" cy="100" rx="60" ry="22" fill="#d4762d"/>
    <ellipse cx="40" cy="95" rx="55" ry="10" fill="#e88c3e" opacity="0.6"/>
    <ellipse cx="40" cy="85" rx="50" ry="6" fill="#f4a460" opacity="0.5"/>
    
    <!-- Lettuce -->
    <path d="M0,125 Q-55,110 -55,125 Q-55,140 0,130" fill="#32cd32"/>
    <path d="M0,125 Q55,110 55,125 Q55,140 0,130" fill="#228b22"/>
    
    <!-- Tomato -->
    <rect x="-40" y="132" width="80" height="12" rx="3" fill="#e74c3c"/>
    <ellipse cx="-25" cy="138" rx="5" ry="3" fill="#ff6347" opacity="0.6"/>
    <ellipse cx="15" cy="138" rx="5" ry="3" fill="#ff6347" opacity="0.6"/>
    
    <!-- Cheese -->
    <rect x="-35" y="145" width="70" height="10" rx="4" fill="#ffd700"/>
    <path d="M-30,145 Q-25,152 -20,145" fill="#ffd700"/>
    <path d="M10,145 Q15,152 20,145" fill="#ffd700"/>
    
    <!-- Meat patty -->
    <ellipse cx="40" cy="158" rx="55" ry="12" fill="#5c3317"/>
    <ellipse cx="40" cy="155" rx="50" ry="6" fill="#7a4422" opacity="0.5"/>
    
    <!-- Bite taken out (top right of burger) -->
    <circle cx="70" cy="105" r="12" fill="#1a1a2e"/>
    <circle cx="70" cy="105" r="12" fill="#d4762d" opacity="0.9"/>
    <circle cx="70" cy="105" r="10" fill="#32cd32" opacity="0.7"/>
    
    <!-- Bite from bottom bun -->
    <circle cx="75" cy="180" r="10" fill="#5c3317"/>
    
    <!-- Bottom bun -->
    <ellipse cx="40" cy="200" rx="60" ry="20" fill="#6b3a1f"/>
    <ellipse cx="40" cy="195" rx="55" ry="8" fill="#8b5a2b" opacity="0.5"/>
    
    <!-- Sesame seeds -->
    <ellipse cx="10" cy="195" rx="4" ry="2.5" fill="#f5f5dc" transform="rotate(-15,10,195)"/>
    <ellipse cx="35" cy="192" rx="4" ry="2.5" fill="#f5f5dc" transform="rotate(-5,35,192)"/>
    <ellipse cx="60" cy="198" rx="4" ry="2.5" fill="#f5f5dc" transform="rotate(10,60,198)"/>
    <ellipse cx="85" cy="194" rx="4" ry="2.5" fill="#f5f5dc" transform="rotate(5,85,194)"/>
    <ellipse cx="20" cy="200" rx="4" ry="2.5" fill="#f5f5dc" transform="rotate(-20,20,200)"/>
    <ellipse cx="55" cy="202" rx="4" ry="2.5" fill="#f5f5dc" transform="rotate(15,55,202)"/>
    
    <!-- Finger (Andy's hand holding burger) -->
    <ellipse cx="380" cy="200" rx="15" ry="10" fill="#f0c8a0" transform="rotate(-20,380,200)"/>
    <ellipse cx="378" cy="195" rx="5" ry="3" fill="#deb887" transform="rotate(-20,378,195)"/>
    <ellipse cx="382" cy="205" rx="5" ry="3" fill="#deb887" transform="rotate(-20,382,205)"/>
    
    <!-- Ketchup/mustard drip -->
    <path d="M85,170 Q90,175 88,185" stroke="#e74c3c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M90,165 Q95,170 93,180" stroke="#ffd700" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Pop art star bursts -->
  <g fill="#ff69b4" opacity="0.6">
    <polygon points="50,50 55,60 65,60 57,67 60,77 50,70 40,77 43,67 35,60 45,60" transform="scale(0.8) translate(0,0)"/>
  </g>
  <g fill="#00ffff" opacity="0.5">
    <polygon points="450,450 453,456 459,456 454,460 456,466 450,462 444,466 446,460 441,456 447,456" transform="translate(0,0)"/>
  </g>
  
  <!-- Halftone circle accent around Andy -->
  <circle cx="190" cy="250" r="100" fill="none" stroke="#ff69b4" stroke-width="2" stroke-dasharray="8,4" opacity="0.3"/>
  <circle cx="190" cy="250" r="90" fill="none" stroke="#00ffff" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.2"/>
  <circle cx="190" cy="250" r="80" fill="none" stroke="#ffff00" stroke-width="1" stroke-dasharray="4,4" opacity="0.15"/>

  <!-- Pop art label -->
  <rect x="60" y="380" width="200" height="40" rx="3" fill="#ff69b4" opacity="0.8"/>
  <text x="160" y="405" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="14" fill="white" font-weight="bold">POP ART!</text>

  <rect x="240" y="380" width="180" height="40" rx="3" fill="#00ffff" opacity="0.8"/>
  <text x="330" y="405" text-anchor="middle" font-family="Comic Sans MS, cursive" font-size="14" fill="#1a1a2e" font-weight="bold">YUM YUM</text>
</svg>