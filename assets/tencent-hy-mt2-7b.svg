<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background pattern -->
  <rect width="600" height="400" fill="#F0F0F0"/>
  
  <!-- Warhol's face (repeating pattern) -->
  <g transform="translate(0, 150)">
    <!-- Head -->
    <circle cx="0" cy="0" r="80" fill="#FFCC00"/>
    
    <!-- Eyes -->
    <circle cx="-15" cy="-10" r="8" fill="#000"/>
    <circle cx="15" cy="-10" r="8" fill="#000"/>
    
    <!-- Smile -->
    <path d="M -30 30 Q 0 50 30 30" stroke="#000" stroke-width="10" fill="none"/>
    
    <!-- Mustache -->
    <path d="M -70 20 Q -50 10 -30 20" stroke="#000" stroke-width="12" fill="none"/>
    <path d="M 70 20 Q 50 10 30 20" stroke="#000" stroke-width="12" fill="none"/>
  </g>
  
  <!-- Repeating torso pattern -->
  <g transform="translate(0, 300)">
    <!-- Torso -->
    <rect x="-60" y="0" width="120" height="100" fill="#FFCC00"/>
    
    <!-- Arms -->
    <rect x="-30" y="-30" width="60" height="60" fill="#FFCC00"/>
    <rect x="30" y="-30" width="60" height="60" fill="#FFCC00"/>
    
    <!-- Hands holding burger -->
    <g transform="translate(-30, -30)">
      <!-- Left hand -->
      <rect x="-25" y="-20" width="50" height="40" fill="#FFCC00"/>
      <rect x="-30" y="-25" width="30" height="30" fill="#FFCC00"/>
      
      <!-- Right hand -->
      <rect x="25" y="-20" width="50" height="40" fill="#FFCC00"/>
      <rect x="30" y="-25" width="30" height="30" fill="#FFCC00"/>
    </g>
  </g>
  
  <!-- Burger (centered) -->
  <g transform="translate(300, 200)">
    <!-- Bun -->
    <ellipse cx="0" cy="0" rx="40" ry="25" fill="#FF6666"/>
    
    <!-- Patty -->
    <ellipse cx="0" cy="-15" rx="35" ry="20" fill="#FF3333"/>
    
    <!-- Cheese -->
    <ellipse cx="0" cy="-25" rx="32" ry="18" fill="#FFF9C4"/>
    
    <!-- Lettuce -->
    <ellipse cx="-10" cy="-30" rx="8" ry="5" fill="#32CD32"/>
    <ellipse cx="10" cy="-30" rx="8" ry="5" fill="#32CD32"/>
    
    <!-- Tomato slice -->
    <ellipse cx="0" cy="-35" rx="30" ry="8" fill="#FF69B4"/>
    
    <!-- Onion ring -->
    <circle cx="0" cy="-45" r="25" fill="#FFA500"/>
  </g>
  
  <!-- Campbell's Soup can background -->
  <rect x="50" y="50" width="500" height="300" fill="#FFFFFF"/>
  
  <!-- Can label (top) -->
  <text x="300" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#000">CAMPBELL'S</text>
  <text x="300" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#000">SOUP</text>
  
  <!-- Can details -->
  <line x1="50" y1="120" x2="550" y2="120" stroke="#000" stroke-width="2"/>
  <line x1="50" y1="130" x2="550" y2="130" stroke="#000" stroke-width="2"/>
  <line x1="50" y1="140" x2="550" y2="140" stroke="#000" stroke-width="2"/>
  <line x1="50" y1="150" x2="550" y2="150" stroke="#000" stroke-width="2"/>
  
  <!-- Can bottom -->
  <rect x="55" y="300" width="490" height="30" fill="#E6E6FA"/>
  <line x1="55" y1="330" x2="595" y2="330" stroke="#000" stroke-width="2"/>
</svg>