<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Background -->
  <rect width="400" height="500" fill="#f5f5f5"/>
  
  <!-- Sky/Background gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f0ff"/>
      <stop offset="100%" stop-color="#cce6ff"/>
    </linearGradient>
  </defs>
  
  <!-- Clouds (pop art style) -->
  <g opacity="0.8">
    <circle cx="80" cy="120" r="25" fill="#ffffff"/>
    <circle cx="110" cy="115" r="30" fill="#ffffff"/>
    <circle cx="150" cy="130" r="20" fill="#ffffff"/>
    <circle cx="70" cy="140" r="18" fill="#ffffff"/>
    <circle cx="300" cy="100" r="22" fill="#ffffff"/>
    <circle cx="340" cy="105" r="28" fill="#ffffff"/>
  </g>
  
  <!-- Sun -->
  <circle cx="350" cy="60" r="35" fill="#ffdd00" opacity="0.9"/>
  <circle cx="360" cy="55" r="15" fill="#ffaa00"/>
  
  <!-- Andy Warhol Figure -->
  <g transform="translate(180, 160)">
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="45" ry="55" fill="#ffb6c1" stroke="#d44" stroke-width="2"/>
    
    <!-- Head -->
    <circle cx="0" cy="-10" r="35" fill="#ffb6c1"/>
    
    <!-- Hair (black) -->
    <path d="M-40,-50 Q-50,-80 -60,-90 L-40,-50" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
    <path d="M-30,-65 Q-45,-85 -55,-95" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- Face details (Warhol style) -->
    <ellipse cx="0" cy="0" rx="12" ry="14" fill="#fff" opacity="0.7"/>
    <ellipse cx="-4" cy="-3" rx="8" ry="10" fill="#fff" opacity="0.6"/>
    <ellipse cx="4" cy="-3" rx="8" ry="10" fill="#fff" opacity="0.6"/>
    
    <!-- Eyes (large, black circles) -->
    <circle cx="-16" cy="-8" r="10" fill="#000"/>
    <circle cx="16" cy="-8" r="10" fill="#000"/>
    <circle cx="-14" cy="-8" r="4" fill="#fff" opacity="0.8"/>
    <circle cx="18" cy="-8" r="4" fill="#fff" opacity="0.8"/>
    
    <!-- Nose -->
    <ellipse cx="0" cy="8" rx="6" ry="4" fill="#ffb6c1"/>
    
    <!-- Mouth (simple line) -->
    <path d="M-5,18 Q0,24 5,18" fill="none" stroke="#333" stroke-width="2"/>
    
    <!-- Right arm (holding burger) -->
    <path d="M35,75 Q60,90 80,70" fill="none" stroke="#ffb6c1" stroke-width="12" stroke-linecap="round"/>
    <path d="M80,70 L85,68" fill="none" stroke="#ffb6c1" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Left arm (resting) -->
    <path d="M-35,75 Q-50,85 -55,78" fill="none" stroke="#ffb6c1" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- Hamburger -->
  <g transform="translate(250, 220) rotate(-10)">
    <!-- Bun (top) -->
    <ellipse cx="0" cy="15" rx="22" ry="8" fill="#8B4513"/>
    <ellipse cx="0" cy="13" rx="18" ry="6" fill="#A0522D"/>
    
    <!-- Sesame seeds (dots) -->
    <circle cx="-12" cy="10" r="1.5" fill="#333"/>
    <circle cx="-8" cy="12" r="1.5" fill="#333"/>
    <circle cx="-4" cy="14" r="1.5" fill="#333"/>
    <circle cx="4" cy="12" r="1.5" fill="#333"/>
    <circle cx="8" cy="10" r="1.5" fill="#333"/>
    <circle cx="12" cy="11" r="1.5" fill="#333"/>
    <circle cx="-10" cy="18" r="1.5" fill="#333"/>
    <circle cx="-6" cy="19" r="1.5" fill="#333"/>
    <circle cx="2" cy="17" r="1.5" fill="#333"/>
    <circle cx="6" cy="18" r="1.5" fill="#333"/>
    
    <!-- Patty (bottom) -->
    <ellipse cx="0" cy="38" rx="18" ry="22" fill="#FFD700"/>
    <!-- Patty seam line -->
    <line x1="-18" y1="38" x2="18" y2="38" stroke="#CC9900" stroke-width="2"/>
    
    <!-- Ketchup spot -->
    <ellipse cx="0" cy="32" rx="6" ry="4" fill="#E3251E"/>
    
    <!-- Mustard dot -->
    <circle cx="3" cy="36" r="2" fill="#F4A460"/>
  </g>
  
  <!-- Pop Art Borders/Decorative Elements -->
  <g fill="none" stroke="#333" stroke-width="2">
    <rect x="0" y="0" width="400" height="500" stroke="currentColor" stroke-dasharray="5,5"/>
    <circle cx="50" cy="50" r="8" fill="currentColor" opacity="0.3"/>
    <circle cx="380" cy="450" r="8" fill="currentColor" opacity="0.3"/>
  </g>
  
  <!-- Text: "ANDY WARHOL" -->
  <text x="200" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#ffb6c1" font-weight="bold">ANDY WARHOL</text>
  
  <!-- Small comic strip style frame border -->
  <rect x="10" y="10" width="380" height="480" fill="none" stroke="#cccccc" stroke-width="1"/>
</svg>