<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Andy Warhol Eating a Hamburger</title>
  <defs>
    <style>
      .skin     { fill: #ffdbac; stroke: #000; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
      .hair     { fill: #f0f0f0; stroke: #000; stroke-width: 2; stroke-linejoin: round; }
      .black    { fill: #1a1a1a; stroke: #000; stroke-width: 2; stroke-linejoin: round; }
      .bun      { fill: #deb887; stroke: #000; stroke-width: 2; stroke-linejoin: round; }
      .patty    { fill: #6f4e37; stroke: #000; stroke-width: 2; stroke-linejoin: round; }
      .cheese   { fill: #ffd700; stroke: #000; stroke-width: 2; stroke-linejoin: round; }
      .lettuce  { fill: #90ee90; stroke: #000; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Pop Art Background -->
  <rect width="400" height="400" fill="#ffe6e6"/>
  <g fill="#ff9999" opacity="0.5">
    <circle cx="40"  cy="60"  r="2"/>
    <circle cx="360" cy="340" r="2"/>
    <circle cx="320" cy="80"  r="2"/>
    <circle cx="80"  cy="320" r="2"/>
    <circle cx="200" cy="380" r="2"/>
    <circle cx="20"  cy="200" r="2"/>
    <circle cx="380" cy="200" r="2"/>
  </g>

  <!-- Andy Warhol -->
  <g id="andy">
    <!-- Body / Turtleneck -->
    <path d="M 150 250 L 150 380 Q 200 400 250 380 L 250 250 Z" class="black"/>
    <!-- Collar -->
    <path d="M 170 250 L 200 230 L 230 250 Z" class="skin"/>

    <!-- Arm -->
    <path d="M 250 260 Q 275 275 300 240" stroke="#ffdbac" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Hand -->
    <circle cx="305" cy="235" r="8" class="skin"/>

    <!-- Head -->
    <ellipse cx="200" cy="170" rx="42" ry="48" class="skin"/>

    <!-- Iconic white wig -->
    <path d="M 160 130 Q 200 100 240 130 Q 250 150 240 180 Q 200 190 160 180 Q 150 150 160 130 Z" class="hair"/>
    <path d="M 160 130 Q 180 110 200 105 Q 220 110 240 130" fill="none" stroke="#000" stroke-width="2"/>

    <!-- Sunglasses -->
    <path d="M 172 162 Q 190 160 208 162 L 210 172 Q 190 174 172 172 Z" class="black"/>
    <path d="M 208 162 Q 226 160 244 162 L 246 172 Q 226 174 208 172 Z" class="black"/>

    <!-- Mouth peeking out -->
    <path d="M 190 182 Q 200 188 210 182" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Hamburger (held up to his mouth) -->
  <g id="hamburger" transform="translate(275, 180)">
    <!-- Bottom bun -->
    <path d="M -12 24 Q 0 34 12 24 L 12 10 Q 0 2 -12 10 Z" class="bun"/>
    <!-- Patty -->
    <path d="M -10 20 Q 0 26 10 20 L 10 7 Q 0 3 -10 7 Z" class="patty"/>
    <!-- Cheese -->
    <path d="M -9 16 Q 0 20 9 16 L 9 5 Q 0 1 -9 5 Z" class="cheese"/>
    <!-- Lettuce -->
    <path d="M -8 12 Q -5 15 0 12 Q 5 15 8 12 L 8 4 Q 0 0 -8 4 Z" class="lettuce"/>
    <!-- Top bun -->
    <path d="M -12 2 Q 0 -6 12 2 L 12 -8 Q 0 -14 -12 -8 Z" class="bun"/>
    <!-- Sesame seeds -->
    <circle cx="-6" cy="-3" r="1" class="black"/>
    <circle cx="4" cy="-5" r="1" class="black"/>
    <circle cx="-1" cy="-7" r="1" class="black"/>
  </g>
</svg>