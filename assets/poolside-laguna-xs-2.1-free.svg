<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f0f0f0"/>

  <!-- Andy Warhol -->
  <g id="andy-warhol">
    <!-- Head -->
    <circle cx="200" cy="200" r="80" fill="#ff69b4" stroke="#000" stroke-width="2"/>
    
    <!-- Hair -->
    <polygon points="150,200 200,130 250,200" fill="#ff0000" stroke="#000" stroke-width="2"/>
    
    <!-- Turtleneck -->
    <rect x="160" y="280" width="80" height="100" fill="#000" stroke="#000" stroke-width="2"/>
    
    <!-- Face -->
    <circle cx="180" cy="190" r="10" fill="#fff" stroke="#000" stroke-width="1"/>/>
    <circle cx="220" cy="190" r="10" fill="#fff" stroke="#000" stroke-width="1"/>
    <path d="M190 230 Q200 240 210 230" fill="none" stroke="#000" stroke-width="2"/>
    
    <!-- Arm holding burger -->
    <path d="M260 320 L300 300 L320 340 L300 360 Z" fill="#000" stroke="#000" stroke-width="1"/>
  </g>

  <!-- Hamburger -->
  <g id="hamburger" transform="translate(280, 300)">
    <!-- Top Bun -->
    <ellipse cx="0" cy="0" rx="40" ry="15" fill="#f5deb3" stroke="#d2b48c" stroke-width="1"/>
    
    <!-- Bite Mark -->
    <path d="M-30 0 Q0 -10 30 0" fill="none" stroke="#d2b48c" stroke-width="2"/>
    
    <!-- Patty -->
    <ellipse cx="0" cy="15" rx="35" ry="10" fill="#8b4513" stroke="#5d290c" stroke-width="1"/>
    
    <!-- Lettuce -->
    <path d="M-35 25 Q0 35 35 25" fill="#7CFC00" stroke="#228B22" stroke-width="1"/>
    
    <!-- Tomato -->
    <ellipse cx="0" cy="40" rx="30" ry="10" fill="#ff4500" stroke="#ff6347" stroke-width="1"/>
    
    <!-- Cheese -->
    <ellipse cx="0" cy="55" rx="30" ry="10" fill="#ffff00" stroke="#ffd700" stroke-width="1"/>
    
    <!-- Bottom Bun -->
    <ellipse cx="0" cy="75" rx="40" ry="15" fill="#f5deb3" stroke="#d2b48c" stroke-width="1"/>"
    
    <!-- Sesame Seeds -->
    <circle cx="-25" cy="-5" r="3" fill="#d2b48c"/>
    <circle cx="25" cy="-5" r="3" fill="#d2b48c"/>
  </g>

  <!-- Speech Bubble -->
  <path d="M150 380 Q100 350 150 320 L250 320 Q300 350 250 380 Z" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="170" y="360" font-size="12" font-family="Arial">YUM!</text>
</svg>