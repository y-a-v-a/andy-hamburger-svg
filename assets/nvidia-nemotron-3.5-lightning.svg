<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Andy Warhol Eating a Hamburger</title>

  <!-- Background -->
  <rect width="400" height="400" fill="#F5F5F5"/>

  <!-- Head -->
  <circle cx="200" cy="200" r="80" fill="#FFB347"/>

  <!-- Glasses -->
  <circle cx="160" cy="180" r="28" fill="none" stroke="#000000" stroke-width="4"/>
  <circle cx="240" cy="180" r="28" fill="none" stroke="#000000" stroke-width="4"/>
  <!-- Lens glints -->
  <circle cx="160" cy="180" r="14" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="240" cy="180" r="14" fill="#FFFFFF" opacity="0.4"/>

  <!-- Face details -->
  <circle cx="200" cy="210" r="5" fill="#000000"/> <!-- nose -->
  <path d="M180 235 Q200 255 220 235" stroke="#000000" stroke-width="3" fill="none"/> <!-- smiling mouth -->

  <!-- Turtleneck sweater -->
  <path d="M140 280 Q200 300 260 280 L260 340 L140 340 Z" fill="#333333"/>

  <!-- Hamburger -->
  <g transform="translate(200 340)">
    <!-- top bun -->
    <rect x="-45" y="-20" width="90" height="20" fill="#8B4513"/>
    <!-- patty -->
    <rect x="-40" y="-8" width="80" height="14" fill="#E36F53"/>
    <!-- cheese -->
    <rect x="-30" y="6" width="60" height="10" fill="#FFD93D"/>
    <!-- bottom bun -->
    <rect x="-45" y="18" width="90" height="20" fill="#8B4513"/>
  </g>
</svg>