<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f5f5f5"/>
  
  <!-- Andy Warhol's head -->
  <circle cx="200" cy="120" r="60" fill="#ffcc99"/>
  <!-- Wig (silver) -->
  <path d="M140 80 Q170 50 200 80 Q230 50 260 80 Q200 110 140 80" fill="#c0c0c0"/>
  <!-- Face -->
  <circle cx="200" cy="120" r="58" fill="#ffcc99"/>
  <!-- Glasses -->
  <rect x="150" y="100" width="100" height="20" rx="10" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="155" y="105" width="90" height="10" fill="#000"/>
  <!-- Nose -->
  <path d="M200 130 L210 140 L200 150" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Mouth -->
  <path d="M180 150 Q200 170 220 150" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Body -->
  <rect x="170" y="140" width="60" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <!-- Arms -->
  <line x1="170" y1="180" x2="150" y2="190" stroke="#000" stroke-width="2"/>
  <line x1="230" y1="180" x2="250" y2="190" stroke="#000" stroke-width="2"/>
  
  <!-- Hamburger -->
  <rect x="150" y="190" width="100" height="20" fill="#d2691e"/>
  <!-- Lettuce -->
  <rect x="155" y="185" width="90" height="5" fill="#90ee90"/>
  <!-- Tomato -->
  <rect x="160" y="195" width="80" height="5" fill="#ff6347"/>
  <!-- Cheese -->
  <rect x="165" y="200" width="70" height="5" fill="#ffdd55"/>
  <!-- Patty -->
  <rect x="170" y="205" width="60" height="10" fill="#8b4513"/>
  
  <!-- Hand holding burger -->
  <path d="M170 205 Q160 210 150 205" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Table -->
  <rect x="100" y="260" width="200" height="20" fill="#8b7355"/>
</svg>