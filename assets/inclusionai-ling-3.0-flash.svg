<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Background -->
  <rect width="400" height="500" fill="#fafafa"/>
  
  <!-- Pop art colored background blocks -->
  <rect x="0" y="0" width="400" height="500" fill="#f5f5f5" opacity="1"/>
  
  <!-- Body / Torso -->
  <path d="M 145 270 Q 145 260 155 260 L 245 260 Q 255 260 255 270 L 260 450 L 140 450 Z" fill="#e74c3c"/>
  <!-- Collar -->
  <path d="M 175 260 L 200 290 L 225 260" fill="#c0392b" stroke="#a93226" stroke-width="1"/>
  
  <!-- Neck -->
  <rect x="185" y="240" width="30" height="30" rx="5" fill="#f5d6c6"/>
  
  <!-- Face -->
  <ellipse cx="200" cy="175" rx="75" ry="85" fill="#fde0c8"/>
  
  <!-- Silver Wig - main shape -->
  <path d="M 115 160 Q 115 80 200 70 Q 285 80 285 160 Q 285 130 260 115 Q 240 100 200 95 Q 160 100 140 115 Q 115 130 115 160 Z" fill="#b8b8b8"/>
  <!-- Wig highlight -->
  <path d="M 130 140 Q 130 95 200 85 Q 240 90 255 110" fill="none" stroke="#d4d4d4" stroke-width="6" opacity="0.7"/>
  <!-- Wig shadow -->
  <path d="M 120 155 Q 130 100 200 90 Q 230 95 260 120" fill="none" stroke="#888" stroke-width="3" opacity="0.3"/>
  
  <!-- Eyes -->
  <!-- Left eye white -->
  <ellipse cx="172" cy="170" rx="14" ry="16" fill="white" stroke="#333" stroke-width="1.5"/>
  <!-- Left iris -->
  <circle cx="174" cy="172" r="7" fill="#4a4a4a"/>
  <circle cx="176" cy="170" r="2.5" fill="white"/>
  <!-- Left eyebrow -->
  <path d="M 155 155 Q 172 148 190 155" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Right eye white -->
  <ellipse cx="228" cy="170" rx="14" ry="16" fill="white" stroke="#333" stroke-width="1.5"/>
  <!-- Right iris -->
  <circle cx="226" cy="172" r="7" fill="#4a4a4a"/>
  <circle cx="228" cy="170" r="2.5" fill="white"/>
  <!-- Right eyebrow -->
  <path d="M 210 155 Q 228 148 245 155" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M 195 185 Q 200 195 205 185" fill="none" stroke="#d4a574" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Mouth - open wide eating -->
  <ellipse cx="200" cy="218" rx="22" ry="16" fill="#8B0000"/>
  <ellipse cx="200" cy="215" rx="18" ry="10" fill="#c0392b"/>
  <!-- Teeth -->
  <rect x="190" y="208" width="20" height="6" rx="1" fill="white"/>
  <!-- Tongue -->
  <ellipse cx="200" cy="225" rx="10" ry="6" fill="#e74c3c"/>
  
  <!-- Cheeks -->
  <ellipse cx="155" cy="200" rx="15" ry="10" fill="#f5b7b1" opacity="0.5"/>
  <ellipse cx="245" cy="200" rx="15" ry="10" fill="#f5b7b1" opacity="0.5"/>
  
  <!-- === HAMBURGER === -->
  
  <!-- Left hand -->
  <ellipse cx="130" cy="250" rx="18" ry="12" fill="#fde0c8" transform="rotate(-30 130 250)"/>
  <ellipse cx="125" cy="245" rx="16" ry="10" fill="#fde0c8" transform="rotate(-30 125 245)"/>
  
  <!-- Right hand -->
  <ellipse cx="270" cy="250" rx="18" ry="12" fill="#fde0c8" transform="rotate(30 270 250)"/>
  <ellipse cx="275" cy="245" rx="16" ry="10" fill="#fde0c8" transform="rotate(30 275 245)"/>
  
  <!-- Hamburger shadow -->
  <ellipse cx="200" cy="285" rx="55" ry="10" fill="#00000010"/>
  
  <!-- Bottom bun -->
  <ellipse cx="200" cy="275" rx="52" ry="18" fill="#d4944a"/>
  <ellipse cx="200" cy="273" rx="50" ry="16" fill="#e8b87a"/>
  <!-- Bottom bun texture lines -->
  <path d="M 155 275 Q 200 280 245 275" fill="none" stroke="#c07830" stroke-width="1" opacity="0.5"/>
  <path d="M 158 279 Q 200 284 242 279" fill="none" stroke="#c07830" stroke-width="1" opacity="0.5"/>
  
  <!-- Patty -->
  <ellipse cx="200" cy="255" rx="44" ry="11" fill="#6b3a1f"/>
  <ellipse cx="200" cy="253" rx="42" ry="10" fill="#8B4513"/>
  <!-- Patty grill marks -->
  <line x1="170" y1="253" x2="170" y2="260" stroke="#5a2d0c" stroke-width="1.5" opacity="0.6"/>
  <line x1="185" y1="252" x2="185" y2="260" stroke="#5a2d0c" stroke-width="1.5" opacity="0.6"/>
  <line x1="215" y1="252" x2="215" y2="260" stroke="#5a2d0c" stroke-width="1.5" opacity="0.6"/>
  <line x1="230" y1="253" x2="230" y2="260" stroke="#5a2d0c" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Cheese -->
  <path d="M 158 242 Q 158 230 200 228 Q 242 230 242 242 L 242 248 Q 200 250 158 248 Z" fill="#f1c40f"/>
  <path d="M 162 240 Q 162 232 200 230 Q 238 232 238 240" fill="none" stroke="#d4a017" stroke-width="1" opacity="0.5"/>
  
  <!-- Lettuce -->
  <ellipse cx="200" cy="232" rx="46" ry="9" fill="#2ecc71"/>
  <ellipse cx="200" cy="230" rx="44" ry="7" fill="#58d68d"/>
  <!-- Lettuce veins -->
  <path d="M 170 232 Q 200 228 230 232" fill="none" stroke="#27ae60" stroke-width="1" opacity="0.5"/>
  
  <!-- Tomato -->
  <ellipse cx="200" cy="222" rx="44" ry="7" fill="#e74c3c"/>
  <ellipse cx="200" cy="221" rx="42" ry="6" fill="#ff6b6b"/>
  <!-- Tomato seeds -->
  <ellipse cx="185" cy="222" rx="2" ry="1.5" fill="#ff9999" opacity="0.6"/>
  <ellipse cx="200" cy="221" rx="2" ry="1.5" fill="#ff9999" opacity="0.6"/>
  <ellipse cx="215" cy="222" rx="2" ry="1.5" fill="#ff9999" opacity="0.6"/>
  
  <!-- Top bun -->
  <ellipse cx="200" cy="210" rx="50" ry="18" fill="#e8c07a"/>
  <ellipse cx="200" cy="208" rx="48" ry="16" fill="#f0d090"/>
  <!-- Top bun highlight -->
  <ellipse cx="195" cy="203" rx="30" ry="6" fill="#f5e0b0" opacity="0.6"/>
  <!-- Sesame seeds -->
  <ellipse cx="175" cy="200" rx="4" ry="2.5" fill="#fef9e7" transform="rotate(-15 175 200)"/>
  <ellipse cx="200" cy="197" rx="4" ry="2.5" fill="#fef9e7" transform="rotate(5 200 197)"/>
  <ellipse cx="225" cy="200" rx="4" ry="2.5" fill="#fef9e7" transform="rotate(20 225 200)"/>
  <ellipse cx="190" cy="210" rx="3.5" ry="2" fill="#fef9e7" transform="rotate(-10 190 210)"/>
  <ellipse cx="215" cy="208" rx="3.5" ry="2" fill="#fef9e7" transform="rotate(15 215 208)"/>
  
  <!-- === Pop Art Accents === -->
  
  <!-- Warhol-style colored echo circles around the head -->
  <circle cx="60" cy="100" r="25" fill="#e74c3c" opacity="0.2"/>
  <circle cx="340" cy="100" r="25" fill="#3498db" opacity="0.2"/>
  <circle cx="60" cy="300" r="20" fill="#2ecc71" opacity="0.15"/>
  <circle cx="340" cy="300" r="20" fill="#f1c40f" opacity="0.15"/>
  
  <!-- Bold black outline for pop art effect -->
  <ellipse cx="200" cy="175" rx="75" ry="85" fill="none" stroke="#2c3e50" stroke-width="3"/>
  
  <!-- Title text -->
  <text x="200" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#555" letter-spacing="3">ANDY WARHOL</text>
  <text x="200" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999" letter-spacing="2">POP ART SERIES</text>
</svg>