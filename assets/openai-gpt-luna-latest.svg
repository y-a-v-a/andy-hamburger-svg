<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Andy Warhol eating a hamburger</title>
  <desc id="desc">A colorful pop-art portrait of Andy Warhol with his signature silver hair and dark glasses, taking a bite of a hamburger.</desc>

  <!-- Pop-art background -->
  <rect width="800" height="800" fill="#f8e64b"/>
  <path d="M0 0h400v800H0z" fill="#40c7d9"/>
  <circle cx="400" cy="340" r="265" fill="#fa6e9b"/>
  <circle cx="400" cy="340" r="242" fill="#ffd94a"/>
  <g fill="#ec5485" opacity=".7">
    <circle cx="150" cy="170" r="8"/><circle cx="190" cy="170" r="8"/>
    <circle cx="150" cy="210" r="8"/><circle cx="190" cy="210" r="8"/>
    <circle cx="650" cy="560" r="8"/><circle cx="690" cy="560" r="8"/>
    <circle cx="650" cy="600" r="8"/><circle cx="690" cy="600" r="8"/>
  </g>

  <!-- Neck and shirt -->
  <path d="M335 426h131v104H335z" fill="#efb99b" stroke="#25233b" stroke-width="8"/>
  <path d="M173 800v-157q18-111 178-131l49 61 49-61q161 20 178 131v157z"
        fill="#25233b" stroke="#171629" stroke-width="10"/>
  <path d="M351 525l49 48 49-48-26-20h-46z" fill="#f4f0e6"/>

  <!-- Hair silhouette -->
  <path d="M274 269q-40-43-4-92-13-54 43-66 25-71 88-47 54-42 96 9 66-2 71 62 49 34 14 88 12 41-26 75l-43-19-25-95-157-12-40 105z"
        fill="#e8e6df" stroke="#25233b" stroke-width="9" stroke-linejoin="round"/>
  <path d="M300 147q32-46 68-22 18-48 56-30 36-33 66 13 42-13 51 33"
        fill="none" stroke="#fffdf4" stroke-width="14" stroke-linecap="round"/>
  <path d="M289 192q-18 36 4 66M559 178q24 26 8 56"
        fill="none" stroke="#aaa9aa" stroke-width="9" stroke-linecap="round"/>

  <!-- Face -->
  <path d="M302 202q16-70 99-75 91-5 126 75l-12 148q-7 92-107 112-98-18-107-112z"
