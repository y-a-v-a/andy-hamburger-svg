  <path d="M586 431q-7-25 9-39 12-10 22 1l14 15q-8-24 8-31 13-6 20 9l15 25q-2-25 14-27 15-1 18 18l8 38q3 26-21 39l-49 16q-27 8-45-12l-31-31q-14-15-3-26 10-10 22-1z"
