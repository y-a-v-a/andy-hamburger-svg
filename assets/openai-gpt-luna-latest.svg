  <path d="M405 283q12-8 25 0" fill="none" stroke="#171629" stroke-width="8"/>
  <ellipse cx="363" cy="294" rx="8" ry="12" fill="#25233b"/>
  <ellipse cx="474" cy="294" rx="8" ry="12" fill="#25233b"/>

