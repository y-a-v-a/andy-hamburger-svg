<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Halftone dot pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="4" fill="#ff5fa2"/>
    </pattern>

    <!-- Bite mask for the burger -->
    <mask id="bite" maskUnits="userSpaceOnUse" x="150" y="300" width="300" height="200">
      <rect x="150" y="300" width="300" height="200" fill="white"/>
      <circle cx="405" cy="365" r="20" fill="black"/>
      <circle cx="412" cy="398" r="20" fill="black"/>
      <circle cx="404" cy="430" r="18" fill="black"/>
      <circle cx="398" cy="455" r="14" fill="black"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="#ffe600"/>
  <rect width="600" height="600" fill="url(#dots)"/>

  <!-- Body / black jacket -->
  <path d="M40 600 Q50 470 190 445 L410 445 Q550 470 560 600 Z"
        fill="#111" stroke="#000" stroke-width="4"/>
  <!-- Turtleneck -->
  <path d="M245 400 L355 400 L370 460 Q300 490 230 460 Z"
        fill="#2b2b2b" stroke="#000" stroke-width="4"/>

  <!-- Head -->
  <ellipse cx="300" cy="290" rx="95" ry="115" fill="#f8e6d6" stroke="#000" stroke-width="5"/>
  <!-- Ears -->
  <ellipse cx="205" cy="295" rx="12" ry="22" fill="#f8e6d6" stroke="#000" stroke-width="4"/>
  <ellipse cx="395" cy="295" rx="12" ry="22" fill="#f8e6d6" stroke="#000" stroke-width="4"/>

  <!-- Silver hair -->
  <path d="M200 270 Q182 170 255 160 Q300 120 352 160 Q420 172 402 270
           Q385 215 345 205 Q300 228 252 205 Q215 220 200 270 Z"
        fill="#e6e6ee" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
  <g stroke="#666" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M240 175 Q250 190 244 205"/>
    <path d="M275 150 Q285 175 275 200"/>
    <path d="M315 148 Q325 172 320 200"/>
    <path d="M355 170 Q350 190 358 205"/>
    <path d="M220 200 Q230 215 226 232"/>
    <path d="M382 205 Q376 220 380 238"/>
  </g>

  <!-- Glasses -->
  <circle cx="260" cy="278" r="26" fill="#cfefff" fill-opacity="0.6" stroke="#000" stroke-width="5"/>
  <circle cx="340" cy="278" r="26" fill="#cfefff" fill-opacity="0.6" stroke="#000" stroke-width="5"/>
  <path d="M286 275 Q300 265 314 275" stroke="#000" stroke-width="5" fill="none"/>
  <path d="M234 275 L208 270 M366 275 L392 270" stroke="#000" stroke-width="4"/>
  <!-- Eyes -->
  <circle cx="264" cy="280" r="5" fill="#000"/>
  <circle cx="336" cy="280" r="5" fill="#000"/>
  <!-- Eyebrows -->
  <path d="M235 240 Q260 228 285 240 M315 240 Q340 228 365 240"
        stroke="#888" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M300 285 Q285 322 305 325" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <ellipse cx="240" cy="325" rx="16" ry="9" fill="#ff8fa8" opacity="0.7"/>
  <ellipse cx="360" cy="325" rx="16" ry="9" fill="#ff8fa8" opacity="0.7"/>

  <!-- Open mouth, ready to bite -->
  <path d="M272 352 Q300 335 328 352 Q300 380 272 352 Z" fill="#8b1a2b" stroke="#000" stroke-width="4"/>
  <path d="M283 353 Q300 345 317 353" stroke="#fff" stroke-width="5" fill="none"/>

  <!-- Burger (with bite taken out) -->
  <g transform="translate(0,35) rotate(-6 300 400)">
    <g mask="url(#bite)" stroke="#000" stroke-width="4" stroke-linejoin="round">
      <!-- Top bun -->
      <path d="M195 395 Q195 328 300 328 Q405 328 405 395 Z" fill="#e39a2d"/>
      <!-- Sesame seeds -->
      <g fill="#fff3c4" stroke="#000" stroke-width="2">
        <ellipse cx="250" cy="352" rx="7" ry="3.5" transform="rotate(-20 250 352)"/>
        <ellipse cx="290" cy="343" rx="7" ry="3.5"/>
        <ellipse cx="330" cy="350" rx="7" ry="3.5" transform="rotate(20 330 350)"/>
        <ellipse cx="270" cy="374" rx="7" ry="3.5" transform="rotate(10 270 374)"/>
        <ellipse cx="315" cy="376" rx="7" ry="3.5" transform="rotate(-15 315 376)"/>
        <ellipse cx="360" cy="372" rx="7" ry="3.5" transform="rotate(25 360 372)"/>
      </g>
      <!-- Lettuce -->
      <path d="M190 395 Q205 415 222 398 Q240 418 258 398 Q276 418 294 398 Q312 418 330 398 Q348 418 366 398 Q384 418 410 395 L410 400 L190 400 Z"
            fill="#3fc04a"/>
      <!-- Tomato -->
      <rect x="198" y="408" width="204" height="14" rx="6" fill="#e5302b"/>
      <!-- Cheese -->
      <path d="M195 422 L405 422 L390 434 L360 448 L330 434 L230 434 L215 446 L200 434 Z" fill="#ffc21a"/>
      <!-- Patty -->
      <rect x="192" y="434" width="216" height="26" rx="13" fill="#6b3a1e"/>
      <!-- Bottom bun -->
      <path d="M197 462 L403 462 Q403 492 370 492 L230 492 Q197 492 197 462 Z" fill="#d88a25"/>
    </g>
  </g>

  <!-- Hands gripping the burger -->
  <g fill="#f8e6d6" stroke="#000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Left hand -->
    <path d="M170 480 Q175 440 215 445 L250 455 Q262 475 245 495 L200 510 Q168 512 170 480 Z"/>
    <path d="M225 452 L240 470 M215 462 L232 480" fill="none"/>
    <!-- Right hand -->
    <path d="M430 490 Q428 450 390 452 L360 462 Q345 482 362 500 L400 512 Q432 514 430 490 Z"/>
    <path d="M375 462 L362 480 M388 470 L376 490" fill="none"/>
  </g>

  <!-- Crumbs -->
  <g fill="#e39a2d" stroke="#000" stroke-width="1.5">
    <circle cx="420" cy="410" r="4"/>
    <circle cx="440" cy="430" r="3"/>
    <circle cx="428" cy="380" r="3"/>
  </g>

  <!-- Pop-art caption -->
  <rect x="20" y="20" width="230" height="56" fill="#fff" stroke="#000" stroke-width="5"/>
  <text x="135" y="58" font-family="Impact, Arial Black, sans-serif" font-size="30"
        text-anchor middle fill="#e5302b" stroke="#000" stroke-width="1" style="text-anchor:middle">
    MMM... POP!
  </text>
</svg>