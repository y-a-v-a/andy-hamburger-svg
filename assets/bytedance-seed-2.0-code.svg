<svg viewBox="0 0 400 500" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Accessibility Metadata -->
  <title>Andy Warhol Eating a Hamburger (Pop Art SVG)</title>
  <desc>
    Pop art illustration of Andy Warhol: signature messy silver wig, cat-eye sunglasses, striped navy button-down, 
    seated at a wooden table holding a layered hamburger (bun, lettuce, patty, cheese) near his open mouth.
  </desc>

  <!-- Reusable Assets (Gradients + Patterns) -->
  <defs>
    <!-- Silver Wig Gradient (subtle texture) -->
    <linearGradient id="wigGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#e6e6e6" />
      <stop offset="50%" stop-color="#f0f0f0" />
      <stop offset="100%" stop-color="#d9d9d9" />
    </linearGradient>

    <!-- Sunglasses Gradient (glossy black) -->
    <linearGradient id="sunglassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#333333" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Navy Striped Shirt Pattern (Warhol's signature) -->
    <pattern id="stripedShirt" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect x="0" y="0"  width="20" height="10" fill="#ffffff" />
      <rect x="0" y="10" width="20" height="10" fill="#000080" />
    </pattern>

    <!-- Hamburger Bun + Patty Gradients -->
    <linearGradient id="bunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#e8c49a" />
      <stop offset="100%" stop-color="#d4a574" />
    </linearGradient>
    <linearGradient id="pattyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#8b4513" />
      <stop offset="100%" stop-color="#654321" />
    </linearGradient>
  </defs>

  <!-- Background Layer (Neutral Pop Art Canvas) -->
  <rect x="0" y="0" width="400" height="500" fill="#f8f8f8" stroke="none" />

  <!-- Table (Wooden Surface) -->
  <rect x="50" y="420" width="300" height="80" fill="#5c4033" stroke="black" stroke-width="1.5" />

  <!-- Subtle Shadow Under Andy (Grounds Him) -->
  <ellipse cx="200" cy="430" rx="100" ry="10" fill="#000000" opacity="0.2" />

  <!-- Left Hand (Resting on Table) -->
  <path d="M275 420 Q290 410 305 420 Q315 415 325 420 Q325 425 315 425 Q305 430 295 425 Q285 430 275 425 Z" 
        fill="#f2d0b0" stroke="black" stroke-width="1.5" />

  <!-- Torso (Striped Shirt + Black Turtleneck) -->
  <rect x="120" y="250" width="160" height="180" fill="url(#stripedShirt)" stroke="black" stroke-width="1.5" />
  <path d="M160 250 L160 280 Q200 290 240 280 L240 250 Z" 
        fill="#000000" stroke="black" stroke-width="1.5" />

  <!-- Right Arm (Holding Hamburger) -->
  <path d="M120 270 Q90 310 105 350 Q95 355 85 350 Q80 345 75 355 Q80 365 95 360 Q110 365 115 355 Q120 345 130 330 Q140 310 145 290 Z" 
        fill="url(#stripedShirt)" stroke="black" stroke-width="1.5" />

  <!-- Head (Skin Tone) -->
  <ellipse cx="200" cy="200" rx="45" ry="50" fill="#f2d0b0" stroke="black" stroke-width="1.5" />

  <!-- Messy Silver Wig (Warhol's Signature) -->
  <path d="M145 190 Q150 140 200 135 Q250 140 255 190 Q250 220 230 230 Q200 240 170 230 Q150 220 145 190 Z" 
        fill="url(#wigGradient)" stroke="black" stroke-width="1.5" />
  <!-- Subtle Wig Texture Lines -->
  <line x1="160" y1="170" x2="170" y2="190" stroke="#d9d9d9" stroke-width="1" />
  <line x1="240" y1="170" x2="230" y2="190" stroke="#d9d9d9" stroke-width="1" />

  <!-- Cat-Eye Sunglasses (Glossy with Highlights) -->
  <ellipse cx="175" cy="195" rx="20" ry="15" fill="url(#sunglassGradient)" stroke="black" stroke-width="1.5" transform="rotate(-5 175 195)" />
  <ellipse cx="225" cy="195" rx="20" ry="15" fill="url(#sunglassGradient)" stroke="black" stroke-width="1.5" transform="rotate(5 225 195)" />
  <rect x="195" y="190" width="10" height="5" fill="#000000" stroke="black" stroke-width="1.5" />
  <!-- Lens Highlights (Gloss Effect) -->
  <ellipse cx="180" cy="188" rx="3" ry="2" fill="white" />
  <ellipse cx="230" cy="188" rx="3" ry="2" fill="white" />

  <!-- Facial Features (Minimal Pop Art Style) -->
  <path d="M200 200 Q202 210 200 215" fill="none" stroke="black" stroke-width="1.5" /> <!-- Nose -->
  <path d="M190 220 Q200 225 210 220" fill="none" stroke="#cc0000" stroke-width="2" /> <!-- Open Red Lips -->

  <!-- Hamburger (Layered, Near Mouth) -->
  <!-- Bottom Bun -->
  <rect x="150" y="240" width="60" height="15" rx="7" fill="url(#bunGradient)" stroke="black" stroke-width="1.5" />
  <!-- Lettuce (Ruffled, Dual Tone) -->
  <path d="M150 240 Q160 230 170 240 Q180 230 190 240 Q200 230 210 240" fill="#228b22" stroke="black" stroke-width="1" />
  <path d="M152 238 Q162 228 172 238 Q182 228 192 238 Q202 228 212 238" fill="#32cd32" stroke="black" stroke-width="0.5" opacity="0.7" />
  <!-- Patty -->
  <rect x="155" y="230" width="50" height="12" rx="5" fill="url(#pattyGradient)" stroke="black" stroke-width="1.5" />
  <!-- Cheese (Curved Wedge Sticking Out) -->
  <path d="M195 230 Q205 220 215 230 L205 235 Z" fill="#ffd700" stroke="black" stroke-width="1" />
  <!-- Ketchup (Tiny Peek) -->
  <circle cx="175" cy="233" r="2" fill="#cc0000" />
  <!-- Top Bun -->
  <rect x="150" y="215" width="60" height="18" rx="9" fill="url(#bunGradient)" stroke="black" stroke-width="1.5" />
  <!-- Sesame Seeds -->
  <ellipse cx="160" cy="220" rx="3" ry="2" fill="white" />
  <ellipse cx="180" cy="217" rx="3" ry="2" fill="white" />
  <ellipse cx="200" cy="223" rx="3" ry="2" fill="white" />
  <ellipse cx="170" cy="225" rx="2" ry="1.5" fill="white" />
</svg>