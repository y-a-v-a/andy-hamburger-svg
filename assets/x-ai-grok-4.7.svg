<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect width="640" height="480" fill="#f4e04d"/>
  <rect x="24" y="24" width="592" height="432" fill="none" stroke="#111" stroke-width="8"/>

  <!-- table -->
  <rect x="40" y="360" width="560" height="70" fill="#c45c26"/>
  <rect x="40" y="360" width="560" height="12" fill="#e8a87c"/>

  <!-- body / jacket -->
  <path d="M170 430 L190 250 Q320 220 450 250 L470 430 Z" fill="#111"/>
  <path d="M250 250 L280 360 L360 360 L390 250" fill="#f7f3e9"/>
  <path d="M310 250 L320 360" stroke="#111" stroke-width="3" fill="none"/>

  <!-- neck -->
  <rect x="290" y="200" width="60" height="55" fill="#f3c7a3"/>

  <!-- head -->
  <ellipse cx="320" cy="155" rx="78" ry="88" fill="#f3c7a3"/>
  <!-- hair -->
  <path d="M250 150 Q255 70 320 68 Q390 70 392 155 Q360 95 320 98 Q278 100 250 150 Z" fill="#d8d8d8"/>
  <path d="M255 145 Q270 110 320 108 Q375 112 385 150" fill="none" stroke="#bbb" stroke-width="3"/>

  <!-- glasses -->
  <rect x="268" y="130" width="42" height="28" rx="4" fill="#111" opacity="0.85"/>
  <rect x="332" y="130" width="42" height="28" rx="4" fill="#111" opacity="0.85"/>
  <rect x="310" y="140" width="22" height="6" fill="#111"/>
  <path d="M268 142 L248 136" stroke="#111" stroke-width="4"/>
  <path d="M374 142 L396 136" stroke="#111" stroke-width="4"/>

  <!-- mouth open around burger -->
  <ellipse cx="338" cy="188" rx="22" ry="14" fill="#5c2a2a"/>

  <!-- arm holding burger -->
  <path d="M390 280 Q470 300 500 250" stroke="#f3c7a3" stroke-width="28" fill="none" stroke-linecap="round"/>
  <ellipse cx="508" cy="242" rx="22" ry="16" fill="#f3c7a3"/>

  <!-- hamburger -->
  <g transform="translate(430,175)">
    <ellipse cx="70" cy="62" rx="58" ry="16" fill="#e6b15a"/>
    <path d="M12 58 Q70 18 128 58 Q70 42 12 58 Z" fill="#f0c36a" stroke="#c48a2a" stroke-width="2"/>
    <rect x="18" y="52" width="104" height="10" rx="3" fill="#3d8b40"/>
    <rect x="16" y="46" width="108" height="8" fill="#c0392b"/>
    <rect x="20" y="40" width="100" height="10" rx="2" fill="#6b3a1f"/>
    <ellipse cx="70" cy="36" rx="52" ry="14" fill="#e8a04a"/>
    <path d="M22 38 Q70 8 118 38 Q70 22 22 38 Z" fill="#f2c14e" stroke="#c48a2a" stroke-width="2"/>
    <!-- sesame -->
    <circle cx="48" cy="28" r="3" fill="#fff6d8"/>
    <circle cx="70" cy="22" r="3" fill="#fff6d8"/>
    <circle cx="92" cy="28" r="3" fill="#fff6d8"/>
    <circle cx="60" cy="32" r="2.5" fill="#fff6d8"/>
  </g>

  <!-- pop caption -->
  <text x="48" y="70" font-family="Impact, Arial Black, sans-serif" font-size="36" fill="#e23d28" stroke="#111" stroke-width="1">WARHOL</text>
  <text x="48" y="108" font-family="Impact, Arial Black, sans-serif" font-size="28" fill="#111">EATS A BURGER</text>
</svg>