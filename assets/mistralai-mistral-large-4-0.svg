<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="benDay" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="12.5" cy="12.5" r="5" fill="#FFD700" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#FF1493"/>
  <rect width="800" height="800" fill="url(#benDay)"/>

  <!-- Decorative stars -->
  <g fill="#FFFF00" stroke="#000" stroke-width="3">
    <path d="M100 120 l12 30 30 12 -30 12 -12 30 -12 -30 -30 -12 30 -12 Z"/>
    <path d="M680 180 l10 25 25 10 -25 10 -10 25 -10 -25 -25 -10 25 -10 Z"/>
    <path d="M640 620 l12 30 30 12 -30 12 -12 30 -12 -30 -30 -12 30 -12 Z"/>
    <path d="M130 640 l10 25 25 10 -25 10 -10 25 -10 -25 -25 -10 25 -10 Z"/>
  </g>

  <!-- Title -->
  <text x="400" y="80" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900" text-anchor="middle" fill="#FFFF00" stroke="#000" stroke-width="3" paint-order="stroke">WARHOL</text>

  <!-- Pop Starburst -->
  <g transform="translate(650, 120)">
    <path d="M0 -50 L15 -15 L50 -20 L25 5 L45 35 L10 25 L0 60 L-10 25 L-45 35 L-25 5 L-50 -20 L-15 -15 Z" fill="#FF0000" stroke="#000" stroke-width="4"/>
    <text x="0" y="8" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#FFFF00" stroke="#000" stroke-width="1" paint-order="stroke">POP!</text>
  </g>

  <!-- Andy Warhol Figure -->
  <g transform="translate(300, 250)">
    <!-- Body / Black Turtleneck -->
    <path d="M -130 350 L -130 180 Q -120 120 -60 110 L 60 110 Q 120 120 130 180 L 130 350 Z" fill="#1a1a1a" stroke="#000" stroke-width="6"/>

    <!-- Neck -->
    <rect x="-25" y="80" width="50" height="40" fill="#FFDBAC" stroke="#000" stroke-width="6"/>

    <!-- Head -->
    <ellipse cx="0" cy="20" rx="70" ry="85" fill="#FFDBAC" stroke="#000" stroke-width="6"/>

    <!-- Ears -->
    <ellipse cx="-70" cy="30" rx="12" ry="18" fill="#FFDBAC" stroke="#000" stroke-width="4"/>
    <ellipse cx="70" cy="30" rx="12" ry="18" fill="#FFDBAC" stroke="#000" stroke-width="4"/>

    <!-- Wig (Iconic White/Silver) -->
    <path d="M -85 10
             Q -95 -40 -60 -75
             Q -75 -105 -35 -100
             Q -50 -135 0 -125
             Q 15 -155 50 -140
             Q 80 -150 72 -115
             Q 105 -110 88 -80
             Q 110 -60 88 -40
             Q 100 -20 82 -15
             L 85 15
             Q 40 5 0 5
             Q -40 5 -85 15 Z"
          fill="#F5F5F5" stroke="#000" stroke-width="6"/>

    <!-- Wig texture lines -->
    <path d="M -55 -60 Q -45 -85 -20 -90" fill="none" stroke="#B0B0B0" stroke-width="3"/>
    <path d="M -10 -105 Q 5 -115 20 -108" fill="none" stroke="#B0B0B0" stroke-width="3"/>
    <path d="M 45 -85 Q 58 -95 68 -88" fill="none" stroke="#B0B0B0" stroke-width="3"/>

    <!-- Glasses -->
    <g fill="rgba(200, 230, 255, 0.4)" stroke="#000" stroke-width="4">
      <circle cx="-28" cy="10" r="20"/>
      <circle cx="28" cy="10" r="20"/>
      <line x1="-8" y1="10" x2="8" y2="10"/>
      <line x1="-48" y1="10" x2="-68" y2="5"/>
      <line x1="48" y1="10" x2="68" y2="5"/>
    </g>

    <!-- Eyes -->
    <circle cx="-28" cy="12" r="4" fill="#000"/>
    <circle cx="28" cy="12" r="4" fill="#000"/>

    <!-- Eyebrows -->
    <path d="M -42 -2 Q -28 -8 -14 -2" fill="none" stroke="#000" stroke-width="4"/>
    <path d="M 14 -2 Q 28 -8 42 -2" fill="none" stroke="#000" stroke-width="4"/>

    <!-- Nose -->
    <path d="M 5 20 L 5 45 L 18 50" fill="none" stroke="#000" stroke-width="4"/>

    <!-- Mouth (open, eating) -->
    <ellipse cx="35" cy="68" rx="20" ry="14" fill="#8B0000" stroke="#000" stroke-width="4"/>
    <ellipse cx="35" cy="72" rx="12" ry="6" fill="#FF6B6B"/>

    <!-- Left Arm (down) -->
    <path d="M -130 180 Q -165 250 -155 350 L -115 350 Q -125 250 -100 200 Z" fill="#1a1a1a" stroke="#000" stroke-width="6"/>

    <!-- Right Arm (raised) -->
    <path d="M 130 180 Q 185 150 205 80 L 175 60 Q 155 130 105 160 Z" fill="#1a1a1a" stroke="#000" stroke-width="6"/>

    <!-- Hand -->
    <circle cx="190" cy="70" r="26" fill="#FFDBAC" stroke="#000" stroke-width="6"/>
  </g>

  <!-- Hamburger -->
  <g transform="translate(430, 330)">
    <!-- Bottom Bun -->
    <path d="M -70 40 Q -70 60 0 60 Q 70 60 70 40 L 70 28 L -70 28 Z" fill="#E8A856" stroke="#000" stroke-width="6"/>

    <!-- Patty -->
    <rect x="-75" y="8" width="150" height="25" rx="12" fill="#6D4C41" stroke="#000" stroke-width="6"/>

    <!-- Cheese (dripping) -->
    <path d="M -70 8 L 70 8 L 62 24 L 45 14 L 28 28 L 10 16 L -8 30 L -25 16 L -45 28 L -62 14 Z" fill="#FDD835" stroke="#000" stroke-width="5"/>

    <!-- Tomato -->
    <rect x="-65" y="-8" width="130" height="18" rx="9" fill="#E53935" stroke="#000" stroke-width="5"/>

    <!-- Lettuce (wavy) -->
    <path d="M -72 -8 Q -62 -25 -48 -12 Q -38 -28 -24 -14 Q -14 -30 0 -14 Q 14 -28 24 -12 Q 38 -25 48 -10 Q 62 -20 72 -8 L 72 2 L -72 2 Z" fill="#7CB342" stroke="#000" stroke-width="5"/>

    <!-- Top Bun -->
    <path d="M -78 -2 Q -78 -60 0 -60 Q 78 -60 78 -2 Z" fill="#E8A856" stroke="#000" stroke-width="6"/>

    <!-- Sesame Seeds -->
    <g fill="#FFF8DC" stroke="#000" stroke-width="2">
      <ellipse cx="-45" cy="-32" rx="7" ry="4" transform="rotate(-25 -45 -32)"/>
      <ellipse cx="-18" cy="-48" rx="7" ry="4" transform="rotate(15 -18 -48)"/>
      <ellipse cx="12" cy="-50" rx="7" ry="4" transform="rotate(-10 12 -50)"/>
      <ellipse cx="42" cy="-32" rx="7" ry="4" transform="rotate(30 42 -32)"/>
      <ellipse cx="0" cy="-28" rx="7" ry="4"/>
      <ellipse cx="-58" cy="-12" rx="7" ry="4" transform="rotate(-45 -58 -12)"/>
      <ellipse cx="58" cy="-12" rx="7" ry="4" transform="rotate(45 58 -12)"/>
    </g>

    <!-- Bite Mark -->
    <path d="M 35 -58 Q 60 -50 68 -25 Q 55 -32 45 -28 Q 52 -45 35 -58 Z" fill="#FF1493"/>
  </g>

  <!-- Hand gripping burger (fingers) -->
  <g transform="translate(430, 330)">
    <path d="M -95 25 Q -105 5 -88 -8 Q -72 -18 -60 -2 L -70 20 Q -85 35 -95 25 Z" fill="#FFDBAC" stroke="#000" stroke-width="5"/>
    <path d="M 95 25 Q 105 5 88 -8 Q 72 -18 60 -2 L 70 20 Q 85 35 95 25 Z" fill="#FFDBAC" stroke="#000" stroke-width="5"/>
    <!-- Thumb -->
    <ellipse cx="-20" cy="45" rx="18" ry="12" fill="#FFDBAC" stroke="#000" stroke-width="4" transform="rotate(-20 -20 45)"/>
  </g>

  <!-- Motion lines (eating action) -->
  <g stroke="#000" stroke-width="4" stroke-linecap="round">
    <line x1="520" y1="280" x2="545" y2="265"/>
    <line x1="530" y1="300" x2="560" y2="295"/>
    <line x1="525" y1="320" x2="555" y2="330"/>
  </g>

  <!-- Caption -->
  <text x="400" y="760" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#FFFFFF" stroke="#000" stroke-width="2" paint-order="stroke">FAMOUS FOR 15 MINUTES... OF LUNCH</text>
</svg>