<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f0f0f0"/>

  <!-- Andy Warhol's head -->
  <circle cx="200" cy="150" r="80" fill="#ffcc99"/>
  <path d="M120,150 Q120,100 200,100 Q280,100 280,150 L280,200 Q200,250 120,200 Z" fill="#ffffff"/>
  <ellipse cx="170" cy="130" rx="10" ry="5" fill="#000000"/>
  <ellipse cx="230" cy="130" rx="10" ry="5" fill="#000000"/>
  <path d="M180,170 Q200,190 220,170" stroke="#000000" stroke-width="2" fill="none"/>

  <!-- Hamburger -->
  <g transform="translate(200, 300)">
    <ellipse cx="0" cy="-20" rx="60" ry="20" fill="#d2b48c"/>
    <ellipse cx="0" cy="0" rx="60" ry="20" fill="#8b4513"/>
    <ellipse cx="0" cy="20" rx="60" ry="20" fill="#d2b48c"/>
    <ellipse cx="0" cy="40" rx="60" ry="20" fill="#d2b48c"/>
  </g>

  <!-- Andy Warhol's hand holding the hamburger -->
  <path d="M200,300 Q220,320 240,300 Q220,280 200,300" fill="#ffcc99"/>
</svg>