<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (white like Warhol canvases) -->
  <rect width="400" height="400" fill="#ffffff"/>
  
  <!-- Warhol-style grid pattern background -->
  <circle cx="200" cy="200" r="195" fill="#ffffff"/>
  
  <!-- Warhol's head (profile view) -->
  <g transform="translate(20, 200)">
    <!-- Hair -->
    <path d="M-40,0 Q-60,-50 -50,-80 Q-30,-100 0,-70 Q30,-100 50,-80 Q60,-50 40,0" 
          fill="#ff6b6b"/>
    
    <!-- Face -->
    <circle cx="0" cy="-20" r="50" fill="#e0e0e0"/>
    <circle cx="-20" cy="10" r="8" fill="#333"/> <!-- Eye -->
    <circle cx="20" cy="10" r="8" fill="#333"/> <!-- Eye -->
    <circle cx="-10" cy="30" r="15" fill="#000"/> <!-- Mouth smile -->
    
    <!-- Hat (iconic Warhol hat) -->
    <ellipse cx="0" cy="60" rx="45" ry="25" fill="#4a4a4a"/>
    <rect x="-10" y="75" width="60" height="5" fill="#5a5a5a"/>
  </g>
  
  <!-- Hamburger (in hand) -->
  <g transform="translate(180, 150)">
    <!-- Bun top -->
    <ellipse cx="0" cy="0" rx="50" ry="40" fill="#ff6b6b"/>
    <ellipse cx="0" cy="-40" rx="45" ry="38" fill="#ff8c69"/>
    
    <!-- Patty -->
    <circle cx="0" cy="-30" r="35" fill="#336699"/>
    
    <!-- Cheese -->
    <ellipse cx="0" cy="-10" rx="38" ry="15" fill="#ffff66"/>
    
    <!-- Bun bottom -->
    <ellipse cx="0" cy="20" rx="50" ry="40" fill="#ff6b6b"/>
    <ellipse cx="0" cy="50" rx="45" ry="38" fill="#ff8c69"/>
    
    <!-- Hand holding burger -->
    <ellipse cx="-50" cy="100" rx="25" ry="35" fill="#333"/>
    <path d="M-50,100 Q-30,115 -10,105" stroke="#555" stroke-width="2"/>
  </g>
  
  <!-- Text in Warhol style -->
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="24" fill="#333333" text-anchor="middle">
    WARHOL HAMBURGER
  </text>
  
  <!-- Grid lines -->
  <line x1="0" y1="0" x2="400" y2="0" stroke="#ddd" stroke-width="1"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#ddd" stroke-width="1"/>
  <line x1="0" y1="400" x2="400" y2="400" stroke="#ddd" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="400" stroke="#ddd" stroke-width="1"/>
</svg>