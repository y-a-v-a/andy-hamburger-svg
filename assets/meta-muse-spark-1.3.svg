<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Background - Warhol pop colors -->
  <rect x="0" y="0" width="800" height="600" fill="#FFDE17"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#halftone)" opacity="0.3"/>
  
  <defs>
    <pattern id="halftone" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="4" fill="#FF0066"/>
    </pattern>
  </defs>

  <!-- Pop frame -->
  <rect x="180" y="20" width="440" height="520" fill="#00CCCC" stroke="black" stroke-width="8"/>

  <!-- Body / black turtleneck -->
  <rect x="300" y="440" width="200" height="100" fill="#111111" stroke="black" stroke-width="4"/>
  <rect x="360" y="410" width="80" height="50" fill="#FFCC99" stroke="black" stroke-width="4"/>

  <!-- Face -->
  <ellipse cx="400" cy="300" rx="115" ry="140" fill="#FFCC99" stroke="black" stroke-width="5"/>

  <!-- Iconic silver spiky wig -->
  <path d="M 270,310 
           L 235,220 L 275,225 
           L 255,140 L 300,170 
           L 305,85 L 340,155 
           L 370,75 L 395,150 
           L 425,80 L 440,155 
           L 480,95 L 485,170 
           L 530,150 L 510,215 
           L 550,230 L 515,300
           L 500,220 L 460,240 L 420,210 L 380,235 L 340,210 L 300,235 Z"
        fill="#F2F2F2" stroke="black" stroke-width="5" stroke-linejoin="round"/>

  <!-- Eyes behind glasses -->
  <ellipse cx="355" cy="295" rx="22" ry="18" fill="white" stroke="black" stroke-width="4"/>
  <ellipse cx="445" cy="295" rx="22" ry="18" fill="white" stroke="black" stroke-width="4"/>
  <circle cx="355" cy="297" r="6" fill="black"/>
  <circle cx="445" cy="297" r="6" fill="black"/>
  <line x1="377" y1="295" x2="423" y2="295" stroke="black" stroke-width="5"/>

  <!-- Eyebrows -->
  <line x1="330" y1="265" x2="380" y2="275" stroke="black" stroke-width="5"/>
  <line x1="470" y1="265" x2="420" y2="275" stroke="black" stroke-width="5"/>

  <!-- Nose -->
  <path d="M 400,310 L 390,345 L 410,345" fill="none" stroke="black" stroke-width="4" stroke-linejoin="round"/>

  <!-- HAMBURGER over mouth -->
  <g id="hamburger">
    <!-- Bottom bun -->
    <ellipse cx="400" cy="410" rx="85" ry="28" fill="#E89B4D" stroke="black" stroke-width="4"/>
    <!-- Patty -->
    <rect x="320" y="385" width="160" height="20" rx="10" fill="#6B3A1F" stroke="black" stroke-width="4"/>
    <!-- Cheese -->
    <path d="M 315,385 L 485,385 L 450,410 L 430,388 L 400,412 L 375,388 L 340,410 Z" fill="#FFD800" stroke="black" stroke-width="3"/>
    <!-- Lettuce -->
    <path d="M 310,380 Q 330,365 350,380 Q 370,395 390,380 Q 410,365 430,380 Q 450,395 470,380 Q 485,370 490,380 L 490,390 L 310,390 Z" fill="#4ED000" stroke="black" stroke-width="3"/>
    <!-- Tomato -->
    <ellipse cx="400" cy="375" rx="75" ry="12" fill="#FF3333" stroke="black" stroke-width="3"/>
    <!-- Top bun -->
    <path d="M 315,375 C 315,320 485,320 485,375 Z" fill="#E89B4D" stroke="black" stroke-width="4"/>
    <!-- Sesame seeds -->
    <ellipse cx="360" cy="345" rx="7" ry="4" fill="white" stroke="black" stroke-width="1.5"/>
    <ellipse cx="400" cy="335" rx="7" ry="4" fill="white" stroke="black" stroke-width="1.5"/>
    <ellipse cx="440" cy="345" rx="7" ry="4" fill="white" stroke="black" stroke-width="1.5"/>
    <ellipse cx="380" cy="360" rx="7" ry="4" fill="white" stroke="black" stroke-width="1.5"/>
    <ellipse cx="420" cy="360" rx="7" ry="4" fill="white" stroke="black" stroke-width="1.5"/>
  </g>

  <!-- Hand holding burger -->
  <ellipse cx="400" cy="450" rx="55" ry="30" fill="#FFCC99" stroke="black" stroke-width="4"/>
  <path d="M 355,440 Q 375,465 395,445 M 385,448 Q 405,473 425,448 M 415,445 Q 435,465 450,440" fill="none" stroke="black" stroke-width="3"/>

  <!-- Bite mark + crumbs for effect -->
  <circle cx="490" cy="340" r="5" fill="#E89B4D" stroke="black" stroke-width="2"/>
  <circle cx="310" cy="350" r="4" fill="#FFD800" stroke="black" stroke-width="2"/>

  <!-- Caption -->
  <text x="400" y="510" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="38" fill="black" stroke="white" stroke-width="1" paint-order="stroke">ANDY EATS A HAMBURGER</text>
</svg>