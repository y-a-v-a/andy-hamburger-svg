<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720"
     role="img" aria-labelledby="title desc">
  <title id="title">Andy Warhol eating a hamburger</title>
  <desc id="desc">A pop-art portrait of Warhol in a black turtleneck.
    His silver fringe falls over round glasses as he lifts a sesame
    hamburger to his lips against a hot-pink halftone background.</desc>

  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.8" fill="#ac195c"/>
    </pattern>
    <pattern id="knit" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 7 7 0" stroke="#464058" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="640" height="720" fill="#ff528d"/>
  <rect width="640" height="720" fill="url(#dots)"/>
  <circle cx="321" cy="288" r="236" fill="#ffe445"/>
  <path d="M82 282 A239 239 0 0 1 324 49" fill="none"
        stroke="#fff5ab" stroke-width="7"/>

  <g stroke="#201c30" stroke-width="6" stroke-linejoin="round"
     stroke-linecap="round">
    <!-- Shoulders and rolled collar -->
    <path d="M47 720 Q48 576 129 536 L236 487 370 482
             475 527 Q563 552 598 720Z" fill="#252235"/>
    <path d="M204 517 230 435 369 426 406 505
             Q322 552 204 517Z" fill="#353044"/>
    <path d="M211 505 Q297 533 394 494 M224 477 Q295 499 379 470"
          fill="none" stroke="#57516a" stroke-width="4"/>
    <path d="m89 700 30-111 32-28-24 139Z" fill="url(#knit)" stroke="none"/>

    <!-- Long face in three-quarter view -->
    <path d="M185 223 Q174 125 269 108 380 87 407 195
             Q417 232 404 265 L429 305 Q434 314 419 319
             L406 322 405 350 Q416 362 404 372
             Q401 423 355 445 317 464 279 437
             Q230 402 211 343 179 343 168 308
             Q157 272 184 270Z" fill="#ffd2a5"/>
    <path d="M201 285 Q177 271 181 298 Q183 316 198 323
             M371 314 Q387 326 401 315" fill="none"
          stroke="#aa5864" stroke-width="4"/>
    <path d="M223 333 Q239 398 285 424 319 446 354 430
             Q314 466 277 438 235 408 211 344Z"
          fill="#eb977f" stroke="none"/>

    <!-- Warhol's jagged silver wig -->
    <path d="M160 275 139 245 155 246 135 208 151 211
             Q125 170 155 131 L142 136 Q165 87 228 79
             L211 69 Q266 48 314 66 L309 53 Q368 63 392 98
             L404 90 409 118 Q437 151 424 201 L409 183
             411 220 390 194 385 232 368 193 349 224
             345 181 319 226 320 184 277 239 284 191
             245 242 247 216 213 265 209 312 190 293
             182 249Z" fill="#e7e6ec"/>
    <path d="M153 208 Q173 139 235 110 M171 230 Q203 151 271 105
             M204 215 Q245 140 307 98 M259 184 Q301 123 344 106
             M320 168 Q350 129 374 125 M375 161 390 145"
          fill="none" stroke="#aaa7b8" stroke-width="5"/>
    <path d="M161 168 Q189 115 240 99 M217 165 Q255 110 292 94"
          fill="none" stroke="#fff" stroke-width="6"/>

    <!-- Eyes and wire frames -->
    <path d="M265 263 Q281 250 300 260 M359 253 Q374 242 388 250"
          fill="none" stroke-width="4"/>
    <ellipse cx="287" cy="263" rx="4" ry="6" fill="#201c30" stroke="none"/>
    <ellipse cx="378" cy="253" rx="4" ry="6" fill="#201c30" stroke="none"/>
    <g fill="none" stroke-width="5">
      <ellipse cx="282" cy="264" rx="39" ry="31" transform="rotate(-8 282 264)"/>
      <ellipse cx="375" cy="254" rx="31" ry="28" transform="rotate(-8 375 254)"/>
      <path d="M321 258 Q331 245 344 253 M243 258 194 250"/>
    </g>
    <path d="M349 351 Q367 340 397 344 L410 351
             Q388 382 360 366Z" fill="#612e40"/>
    <path d="M360 350 Q377 345 396 347 L388 354 365 356Z"
          fill="#fff3dc" stroke="none"/>

    <!-- Bent forearm, behind the sandwich -->
    <path d="M410 720 Q424 612 444 539 L455 465
             506 447 Q531 492 516 554 L494 720Z" fill="#ffd2a5"/>
    <path d="m391 720 34-150 q40 21 94 11 l-9 139Z" fill="#252235"/>
    <path d="M426 587 Q463 605 511 597" fill="none" stroke="#57516a"/>

    <!-- Hamburger tipped up to the mouth -->
    <g transform="rotate(12 436 398)">
      <path d="M351 418 Q435 404 536 418 L530 437
               Q523 456 443 456 365 455 355 440Z" fill="#e69737"/>
      <path d="M351 397 Q368 387 395 394 L512 392
               Q548 392 540 414 537 430 508 427
               L378 431 Q344 429 351 397Z" fill="#663a32"/>
      <path d="m354 396 91-7 84 8-39 30-22-20-87 3Z" fill="#ffdc38"/>
      <path d="M349 388 Q353 380 368 380 L522 380
               Q546 379 540 392 L524 397 508 392
               487 401 467 394 444 403 426 395
               398 403 380 396 360 401Z" fill="#66c75c"/>
      <path d="M355 379 Q424 362 531 376 L531 387
               Q451 382 358 392Z" fill="#ee4840"/>
      <path d="M351 378 Q358 323 423 316 494 305 528 350
               Q540 365 540 378 461 390 351 378Z" fill="#ffb94e"/>
      <g stroke="#fff1c4" stroke-width="5">
        <path d="m377 354 6-4 m15-13 7-2 m17 20 7-3 m12-25 7 1
                 m14 14 7 3 m17-14 5 4 m13 18 6 2 m-103 2 5-2"/>
      </g>
    </g>

    <!-- Fingers curl around the lower bun -->
    <path d="M446 483 Q434 467 431 453 L413 441
             Q399 431 405 423 411 416 421 422 L451 437
             432 419 Q423 408 431 402 438 397 449 406
             L475 426 460 407 Q454 397 462 392
             469 388 477 397 L500 424
             Q517 439 510 459 505 477 491 488"
          fill="#ffd2a5"/>
    <path d="m451 437 10 8 m14-19 8 9 M445 477 Q453 492 467 494"
          fill="none" stroke="#b76b68" stroke-width="3"/>
  </g>

  <rect x="9" y="9" width="622" height="702" fill="none"
        stroke="#201c30" stroke-width="8"/>
</svg>