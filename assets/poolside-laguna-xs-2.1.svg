<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f0f0f0"/>
  
  <!-- Andy Warhol's Head -->
  <circle cx="200" cy="180" r="80" fill="#FFD700" stroke="#000" stroke-width="3"/>
  
  <!-- Mustache (Warhol's signature look) -->
  <path d="M160 220 Q200 260 240 220" fill="none" stroke="#000" stroke-width="3"/>
  
  <!-- Eyes -->
  <circle cx="180" cy="150" r="10" fill="#000"/>
  <circle cx="220" cy="150" r="10" fill="#000"/>
  
  <!-- Mouth -->
  <path d="M170 190 Q200 210 230 190" fill="none" stroke="#000" stroke-width="2"/>
  
  <!-- Hamburger -->
  <!-- Bottom Bun -->
  <ellipse cx="250" cy="280" rx="50" ry="20" fill="#F0E68C" stroke="#000" stroke-width="2"/>
  
  <!-- Beef Patty -->
  <ellipse cx="250" cy="300" rx="45" ry="15" fill="#8B4513" stroke="#000" stroke-width="2"/>
  
  <!-- Lettuce -->
  <path d="M205 315 Q250 340 295 315" fill="#228B22" stroke="#000" stroke-width="2"/>
  
  <!-- Tomato -->
  <ellipse cx="250" cy="330" rx="40" ry="12" fill="#FF4500" stroke="#000" stroke-width="2"/>
  
  <!-- Cheese -->
  <ellipse cx="250" cy="348" rx="40" ry="12" fill="#FFFACD" stroke="#000" stroke-width="2"/>
  
  <!-- Top Bun -->
  <ellipse cx="250" cy="365" rx="50" ry="20" fill="#F0E68C" stroke="#000" stroke-width="2"/>
  
  <!-- Sesame Seeds -->
  <circle cx="230" cy="355" r="5" fill="#000"/>
  <circle cx="270" cy="355" r="5" fill="#000"/>
  
  <!-- Arm holding the burger -->
  <path d="M220 250 Q240 270 260 290" fill="none" stroke="#FFD700" stroke-width="5"/>
</svg>