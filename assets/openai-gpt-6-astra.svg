<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="800" viewBox="0 0 800 800"
     role="img" aria-labelledby="title desc">
  <title id="title">Andy Warhol eating a hamburger</title>
  <desc id="desc">
    A pop-art portrait of Andy Warhol with his silver-white wig and
    black turtleneck, raising a hamburger to his mouth against a
    bright pink, turquoise, and yellow background.
  </desc>

  <defs>
    <pattern id="dots" width="16" height="16"
             patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.3" fill="#171720" opacity=".17"/>
    </pattern>

    <pattern id="smallDots" width="9" height="9"
             patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ac4361" opacity=".35"/>
    </pattern>

    <clipPath id="faceClip">
      <path d="M305 229
               Q319 187 389 195
               Q457 193 481 250
               L477 323
               Q483 349 459 382
               Q440 420 397 435
               Q351 426 323 385
               Q303 347 300 293Z"/>
    </clipPath>

    <style>
      .ink {
        stroke: #171720;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .detail {
        fill: none;
        stroke: #171720;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Screen-printed background -->
  <rect width="800" height="800" fill="#ffdf3e"/>
  <rect x="400" width="400" height="800" fill="#ff638e"/>
  <path d="M0 475L800 170V800H0Z" fill="#48d4d0"/>
  <rect width="800" height="800" fill="url(#dots)"/>
  <rect x="23" y="23" width="754" height="754"
        fill="none" stroke="#171720" stroke-width="7"/>

  <text x="57" y="111"
        font-family="Arial Black, Helvetica, sans-serif"
        font-size="67" font-weight="900"
        letter-spacing="-3" fill="#171720">ANDY.</text>
  <text x="744" y="102" text-anchor="end"
        font-family="monospace" font-size="18"
        font-weight="bold" fill="#171720">POP / LUNCH</text>

  <!-- Offset print silhouette -->
  <path d="M140 719
           Q153 508 312 479
           L333 421
           Q268 360 277 261
           Q260 165 356 150
           Q464 117 504 218
           L510 342
           Q536 379 515 427
           L593 462
           Q673 543 674 719Z"
