  <path class="detail" d="M496 480L525 477M551 463L542 479"/>

  <!-- Sleeve overlapping wrist -->
  <path class="ink" fill="#252430"
        d="M490 610Q528 634 586 614
           L605 725H467Z"/>
  <path d="M504 635Q541 654 579 637"
        fill="none" stroke="#666073" stroke-width="5"/>

  <!-- Poster footer -->
  <rect x="43" y="711" width="714" height="47" fill="#171720"/>
  <text x="400" y="743" text-anchor="middle"
        fill="#ffdf3e" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="bold" letter-spacing="6">
    EVERYDAY, EXTRAORDINARY.
  </text>
</svg>